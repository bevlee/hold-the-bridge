<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hold the Bridge</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed WebGL bridge, thin HUD strips pinned to the top and bottom, modal cards for start / game over. Single daytime look. */
:root {
  --sky: #c9c9ee;
  --ink: #12161d;
  --paper: #f5f7f9;
  --panel: rgba(32, 41, 66, 0.90);
  --good: #43dcd0;
  --bad: #e8343b;
  --gold: #ffc83d;
  --muted: #9aa6b4;
  --display: 'Bungee', 'Arial Black', Impact, system-ui, sans-serif;
  --body: 'Chakra Petch', ui-sans-serif, system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0; overflow: hidden; background: var(--sky); color: var(--paper);
  font-family: var(--body); touch-action: none; user-select: none; -webkit-user-select: none;
}
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; }

.hud-top {
  position: fixed; left: 0; right: 0; top: 0; pointer-events: none;
  padding-top: calc(10px + env(safe-area-inset-top, 0px)); padding-bottom: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
}
.stat { background: var(--panel); border-radius: 10px; padding: 6px 12px; display: grid; gap: 0; min-width: 0; }
.stat b { font-family: var(--display); font-weight: 400; font-size: 22px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.stat.right { text-align: right; }

.meter {
  position: fixed; left: 50%; transform: translateX(-50%); top: calc(64px + env(safe-area-inset-top, 0px)); width: min(60vw, 280px);
  background: var(--panel); border-radius: 10px; padding: 6px 10px 8px; display: grid; gap: 5px; pointer-events: none;
}
.meter span { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); text-align: center; }
.meter i { display: block; height: 10px; border-radius: 5px; background: rgba(255, 255, 255, 0.14); overflow: hidden; }
.meter b { display: block; height: 100%; border-radius: 5px; transition: width .15s linear; }
#toasts { position: fixed; left: 0; right: 0; top: 30%; display: grid; justify-items: center; gap: 6px; pointer-events: none; }
.toast {
  font-family: var(--display); font-size: clamp(20px, 5vw, 34px); color: var(--paper);
  -webkit-text-stroke: 1.5px var(--ink); paint-order: stroke fill; text-shadow: 0 3px 0 var(--ink);
  animation: toast 1.4s ease-out forwards;
}
.champ { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); }
.toast.big { font-size: clamp(38px, 10vw, 64px); -webkit-text-stroke-width: 2.5px; }
@keyframes toast { 0% { transform: translateY(14px) scale(.8); opacity: 0 } 15% { transform: none; opacity: 1 } 70% { opacity: 1 } 100% { transform: translateY(-30px); opacity: 0 } }
@media (prefers-reduced-motion: reduce) { .toast { animation-duration: 2s; animation-name: toastFade } @keyframes toastFade { 0%,80% { opacity: 1 } 100% { opacity: 0 } } }

.modal {
  position: fixed; inset: 0; display: grid; place-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px; background: rgba(10, 14, 20, 0.35);
}
.card {
  background: var(--panel); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  border-radius: 16px; padding: 22px 22px 20px; width: min(440px, 100%); display: grid; gap: 14px;
}
.card h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(30px, 8vw, 44px); line-height: 1; text-wrap: balance; }
.card h1 em { font-style: normal; color: var(--bad); }
.card p { margin: 0; line-height: 1.45; color: #d7dde5; }
.endstats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.endstats div { display: grid; }
.endstats b { font-family: var(--display); font-weight: 400; font-size: 24px; font-variant-numeric: tabular-nums; }
.endstats span { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
button.go {
  font-family: var(--display); font-size: 20px; padding: 12px 18px; border: 0; border-radius: 12px; cursor: pointer;
  background: var(--paper); color: var(--ink); box-shadow: 0 4px 0 #8b96a3; transition: transform .1s, box-shadow .1s;
}
button.go:active { transform: translateY(3px); box-shadow: 0 1px 0 #8b96a3; }
button.go:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.kbd { font-size: 12px; color: var(--muted); }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.modes .go { font-size: 17px; padding-inline: 10px; display: grid; gap: 2px; }
.modes .go small { font-family: var(--body); font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.7; }
button.go.alt { background: var(--gold); box-shadow: 0 4px 0 #a37a12; }
button.go.alt:active { box-shadow: 0 1px 0 #a37a12; }
button.go.big { grid-column: 1 / -1; font-size: 28px; padding-block: 18px; }
</style>

<div id="stage"></div>

<div class="hud-top" id="hud" hidden>
  <div class="stat"><b id="hudUnits">1</b><span id="hudWeapon">Crew · Pistol</span></div>
  <div class="stat right"><b id="hudDist">0 m</b><span id="hudKills">0 down</span></div>
</div>
<div class="meter" id="meter" hidden><span id="meterLabel"></span><i><b id="meterFill"></b></i></div>
<div id="toasts"></div>
<button class="go alt champ" id="champBtn" hidden>Champion</button>

<div class="modal" id="startModal">
  <div class="card">
    <h1>Hold the <em>Bridge</em></h1>
    <div class="modes" id="modeGrid"></div>
  </div>
</div>

<div class="modal" id="endModal" hidden>
  <div class="card">
    <h1 id="endTitle">Line broken</h1>
    <p id="endReason"></p>
    <div class="endstats" id="endStats"></div>
    <p class="kbd" id="endBuild"></p>
    <div class="modes">
      <button class="go" id="againBtn">Run it back</button>
      <button class="go alt" id="menuBtn">Change mode</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="assets/anime/models.js"></script>
<script>
(() => {
// ---------- tuning ----------
const HALF_W = 5;            // inner half-width of the deck (walls at ±HALF_W)
const BARREL_R = 2.42;       // two barrels span the deck
const BARREL_H = 2.5;
const LINE_Z = 3.4;          // the red line behind the crew
const SPAWN_Z = -55;          // how far ahead things appear (visible bridge length)
const LANE_X = HALF_W * 2 / 3;  // lane centres in three-lanes mode
const LANE_EDGE = HALF_W / 3;   // lane walls sit at ±LANE_EDGE
const LANE_WALL_T = 0.16;       // half thickness of a lane wall
const LANE_WALL_END = -3;       // lane walls stop here so the crew can cross between lanes
const GAME_SPEED = 2;        // simulation runs this many fixed steps per frame
const SEC = GAME_SPEED;      // game seconds per real second; design times are written in real seconds
const MAX_UNITS = 120;
const MAX_BULLETS = 3500;
const BULLET_Y = 0.62;
const BASE_DMG = 10;
const CONTACT_DMG = 10;      // hp an enemy loses for each crew member it kills
const GATE_BULLETS = 50;     // bullets needed to raise a gate by +1
const RANGE = 28;            // bullet travel distance (also caps how long a gate can be farmed)
const SLOT = 0.34;           // crowd packing spacing

const scrollSpeed = d => 2.4 + 1.8 * (1 - Math.exp(-d / 900));
const bulletSpeed = d => 7 + 15 * (1 - Math.exp(-d / 400));
const enemyHp = d => d < 60 ? 1 : Math.round(1 + d / 45 + 10 * Math.pow(d / 350, 2));
const crewBonus = d => 1 + Math.floor(d / 500);   // +crew barrels start at +1 and climb slowly
const bossHp = k => Math.round(150 * Math.pow(k, 1.6));
// left-lane toilet rolls: each takes longer than the last, and the ninth (the last before boss 3) is a wall
const ROLL_HP = [80, 150, 250, 400, 600, 850, 1200, 1700, 4000];
const rollHp = k => ROLL_HP[Math.min(k, ROLL_HP.length) - 1] * (k > ROLL_HP.length ? 1.3 ** (k - ROLL_HP.length) : 1);
const LANE_BOSS_HP = [800, 2000, 4500];  // three-lanes mode ends when the third boss falls
const ROLL_DMG_SCALE = 0.15;             // shots do 15% of their damage to toilet rolls
const HORDE_FIRST_Z = -34;               // the horde is already on screen when the run starts
const HORDE_MAX = 450;                   // cap on live enemies so the horde stays playable
const enemyWalk = d => 0.35 + Math.min(1.7, d / 650);

const TIERS = [ // hp ceiling → color
  { max: 10, color: 0x16181c, name: 'black' },
  { max: 25, color: 0x2456d6, name: 'blue' },
  { max: 50, color: 0x1f9a47, name: 'green' },
  { max: 100, color: 0xe8c21a, name: 'yellow' },
  { max: 200, color: 0xf07a12, name: 'orange' },
  { max: 400, color: 0xd8262c, name: 'red' },
  { max: Infinity, color: 0x8a2be2, name: 'purple' },
];

const REWARDS = {
  MULTI:  { label: '+1 SHOT',   color: '#2f8cff', cap: s => s.multi < 6 },
  DIAG:   { label: 'DIAGONAL',  color: '#9b5cff', cap: s => s.diag < 4 },
  SIZE:   { label: 'BIG SHOT',  color: '#a0522d', cap: s => s.size < 6 },
  RATE:   { label: 'FIRE RATE', color: '#18b56a', cap: s => s.rate < 8 },
  DMG:    { label: '+5 DMG',    color: '#d6a400', cap: () => true },
  UNITS:  { label: '+5 CREW',   color: '#f5f7f9', cap: () => true },
  WEAPON: { label: 'WEAPON', color: '#56683a', cap: s => s.weapon < WEAPONS.length - 1 },
  BREAKER: { label: 'BOSS BREAKER', color: '#ffc83d', cap: () => false },  // only from armored-boss rolls
  HEAT:   { label: '+60 HEAT',   color: '#ff7a00', cap: () => false },  // only from Whiteout campfires
  REPAIR: { label: '+200 WALL',  color: '#8a96a8', cap: () => false },  // only from Hold the Wall reward rows
  SPIKE:  { label: 'SPIKE SHOT', color: '#e8343b', shape: 'spike', cap: s => s.spike < 4 },
  BOMB:   { label: 'BOMB SHOT',  color: '#ff7a00', shape: 'bomb',  cap: s => s.bomb < 4 },
  RING:   { label: 'RING SHOT',  color: '#19c3d8', shape: 'ring',  cap: s => s.ring < 4 },
  STAR:   { label: 'STAR SHOT',  color: '#ff4fb3', shape: 'star',  cap: s => s.star < 4 },
};
const SHAPE_KEYS = ['spike', 'bomb', 'ring', 'star'];
const WEAPONS = [
  { name: 'Pistol', rate: 1,   dmg: 1,   size: 0,     speed: 1,   splash: 0,   pierce: 0 },
  { name: 'Rifle',  rate: 1.8, dmg: 0.8, size: -0.03, speed: 1.2, splash: 0,   pierce: 0 },
  { name: 'Rocket', rate: 0.7, dmg: 2.2, size: 0.1,   speed: 0.8, splash: 1.4, pierce: 0 },
  { name: 'Laser',  rate: 1.6, dmg: 1.6, size: 0,     speed: 1.6, splash: 0,   pierce: 2 },
];
const REWARD_WEIGHT = { WEAPON: 3, MULTI: 3, DIAG: 3, SIZE: 2, RATE: 3, DMG: 2, UNITS: 2, SPIKE: 2, BOMB: 2, RING: 2, STAR: 2 };

// ---------- three setup ----------
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const SKY = 0xc9c9ee;
renderer.outputEncoding = THREE.sRGBEncoding;
const scene = new THREE.Scene();
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.Fog(SKY, 30, 60);
const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 300);
scene.add(new THREE.HemisphereLight(0xffffff, 0x4a5868, 0.72));
const sun = new THREE.DirectionalLight(0xfff6e8, 0.85);
sun.position.set(7, 22, 2);
sun.target.position.set(0, 0, -18);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 36, bottom: -36, near: 1, far: 70 });
sun.shadow.bias = -0.0008;
scene.add(sun); scene.add(sun.target);
const shade = o => { o.traverse(m => { if (m.isMesh) m.castShadow = true; }); return o; };

let camBaseY = 8.5, camBaseZ = 10.5;
function resize() {
  const w = window.innerWidth, h = window.innerHeight, aspect = w / h;
  renderer.setSize(w, h, false);
  camera.aspect = aspect;
  const hfov = 64 * Math.PI / 180;
  const vfov = 2 * Math.atan(Math.tan(hfov / 2) / aspect) * 180 / Math.PI;
  camera.fov = Math.max(52, Math.min(80, vfov));
  const narrow = Math.max(0, 1 - aspect);
  camBaseY = 8.5 + narrow * 7;
  camBaseZ = 10.5 + narrow * 5;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

// ---------- Blender-authored anime kit: shared vertex-colored meshes ----------
const modelGeometries = {};
for (const [name, data] of Object.entries(window.ANIME_MODELS)) {
  const base = new THREE.BufferGeometry();
  base.setAttribute('position', new THREE.Float32BufferAttribute(data.position, 3));
  base.setAttribute('normal', new THREE.Float32BufferAttribute(data.normal, 3));
  base.setAttribute('color', new THREE.Float32BufferAttribute(data.color, 3));
  base.setIndex(data.index);
  base.computeBoundingSphere();
  modelGeometries[name] = data.frames ? data.frames.map(positions => {
    const pose = new THREE.BufferGeometry();
    pose.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    pose.setAttribute('normal', base.attributes.normal);
    pose.setAttribute('color', base.attributes.color);
    pose.setIndex(base.index);
    pose.computeBoundingSphere();
    return pose;
  }) : base;
}
// Release the serialized arrays after uploading the reusable geometry.
delete window.ANIME_MODELS;
const POSES = modelGeometries.crew;
const poseFor = (ph, kind = 'crew') => modelGeometries[kind][Math.floor(((ph % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2) / (Math.PI * 2) * 8) % 8];
const animeMaterial = color => new THREE.MeshToonMaterial({ vertexColors: true, color });
const unitMat = animeMaterial(0xffffff);
const tierMats = TIERS.map((_, i) => animeMaterial(new THREE.Color().setHSL(.96 - i * .035, .09 + i * .025, .95 - i * .025)));
const propMat = animeMaterial(0xffffff);
const sealedPropMat = animeMaterial(0x667088);
const tierOf = hp => TIERS.findIndex(t => hp <= t.max);

// ---------- scenery ----------
const deckLen = 200;
const deck = new THREE.Mesh(new THREE.BoxGeometry(HALF_W * 2 + 1.2, 0.6, deckLen), new THREE.MeshLambertMaterial({ color: 0x7885a6 }));
deck.position.set(0, -0.3, -deckLen / 2 + 30);
deck.receiveShadow = true;
scene.add(deck);
const wallMat = new THREE.MeshLambertMaterial({ color: 0xe3e8fa });
for (const s of [-1, 1]) {
  const wall = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.3, deckLen), wallMat);
  wall.position.set(s * (HALF_W + 0.25), 0.65, -deckLen / 2 + 30);
  wall.receiveShadow = true; wall.castShadow = true;
  scene.add(wall);
  const cap = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.12, deckLen), new THREE.MeshLambertMaterial({ color: 0x55d9cd }));
  cap.position.set(s * (HALF_W + 0.25), 1.36, -deckLen / 2 + 30);
  scene.add(cap);
}
const water = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshLambertMaterial({ color: 0x78bfcf }));
water.rotation.x = -Math.PI / 2;
water.position.y = -7;
scene.add(water);

const lineMat = new THREE.MeshBasicMaterial({ color: 0xff2a2a });
const defenseLine = new THREE.Mesh(new THREE.BoxGeometry(HALF_W * 2, 0.04, 0.22), lineMat);
defenseLine.position.set(0, 0.02, LINE_Z);
scene.add(defenseLine);

const movers = []; // scrolling scenery that wraps
const dashGeo = new THREE.BoxGeometry(0.16, 0.02, 2.2), dashMat = new THREE.MeshBasicMaterial({ color: 0xf0f0f0 });
for (let i = 0; i < 24; i++) {
  const m = new THREE.Mesh(dashGeo, dashMat);
  m.position.set(0, 0.01, 20 - i * 7);
  scene.add(m); movers.push({ m, wrap: 24 * 7 });
}
for (let i = 0; i < 12; i++) {
  for (const s of [-1, 1]) {
    const g = new THREE.Group();
    const lantern = new THREE.Mesh(modelGeometries.pylon, propMat);
    lantern.castShadow = true; g.add(lantern);
    g.position.set(s * (HALF_W + 0.25), 0, 20 - i * 14);
    scene.add(g); movers.push({ m: g, wrap: 12 * 14 });
  }
}

const laneDecor = new THREE.Group();
for (const s of [-1, 1]) {
  const len = 170;
  const wall = new THREE.Mesh(new THREE.BoxGeometry(LANE_WALL_T * 2, 1.3, len), wallMat);
  wall.position.set(s * LANE_EDGE, 0.65, LANE_WALL_END - len / 2);
  wall.castShadow = wall.receiveShadow = true;
  laneDecor.add(wall);
  const cap = new THREE.Mesh(new THREE.BoxGeometry(LANE_WALL_T * 2 + 0.12, 0.12, len), new THREE.MeshLambertMaterial({ color: 0x55d9cd }));
  cap.position.set(s * LANE_EDGE, 1.36, LANE_WALL_END - len / 2);
  laneDecor.add(cap);
}
const conveyor = new THREE.Mesh(new THREE.PlaneGeometry(HALF_W * 2 / 3 - LANE_WALL_T * 2, deckLen), new THREE.MeshLambertMaterial({ color: 0x8ba5cf }));
conveyor.rotation.x = -Math.PI / 2;
conveyor.position.set(LANE_X, 0.008, -deckLen / 2 + 30);
conveyor.receiveShadow = true;
laneDecor.add(conveyor);
laneDecor.visible = false;
scene.add(laneDecor);
const fortDecor = new THREE.Group();  // Hold the Wall: a low battlement right behind the crew
{
  const stone = new THREE.MeshLambertMaterial({ color: 0x8d97ab });
  const base = new THREE.Mesh(new THREE.BoxGeometry(HALF_W * 2 + 1, 1, 0.8), stone); base.position.set(0, 0.5, LINE_Z + 0.6); fortDecor.add(base);
  for (let i = 0; i < 9; i++) { const m = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.5, 0.8), stone); m.position.set(-HALF_W + 0.4 + i * (HALF_W * 2 - 0.8) / 8, 1.25, LINE_Z + 0.6); fortDecor.add(m); }
  shade(fortDecor);
  fortDecor.visible = false;
  scene.add(fortDecor);
}
const cannonDecor = new THREE.Group();  // Cannon Rush: the enemy base at the far end and the cannon the crew aims
const CANNON_BASE_Z = -46;
{
  const red = new THREE.MeshLambertMaterial({ color: 0xb8323a }), dark = new THREE.MeshLambertMaterial({ color: 0x4a2a35 });
  const keep = new THREE.Mesh(new THREE.BoxGeometry(HALF_W * 2 - 1, 3.4, 2.4), red); keep.position.set(0, 1.7, CANNON_BASE_Z - 1.4); cannonDecor.add(keep);
  for (const x of [-3.6, 3.6]) { const t = new THREE.Mesh(new THREE.CylinderGeometry(1, 1.1, 5, 12), dark); t.position.set(x, 2.5, CANNON_BASE_Z - 1.4); cannonDecor.add(t); }
  const gate = new THREE.Mesh(new THREE.BoxGeometry(2.4, 2.2, 0.2), dark); gate.position.set(0, 1.1, CANNON_BASE_Z - 0.15); cannonDecor.add(gate);
  const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.42, 1.6, 14), new THREE.MeshLambertMaterial({ color: 0x2a2e35 }));
  barrel.rotation.x = Math.PI / 2 - 0.25; barrel.position.y = 0.75;
  const wheels = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 1.3, 14), new THREE.MeshLambertMaterial({ color: 0x8a5a2b })); wheels.rotation.z = Math.PI / 2; wheels.position.set(0, 0.42, 0.3);
  const cannon = new THREE.Group(); cannon.add(barrel, wheels); cannonDecor.add(cannon);
  cannonDecor.userData.cannon = cannon;
  shade(cannonDecor);
  cannonDecor.visible = false;
  scene.add(cannonDecor);
}
const DECOR = [laneDecor, fortDecor, cannonDecor];

const snow = new THREE.Points(new THREE.BufferGeometry(), new THREE.PointsMaterial({ color: 0xffffff, size: 0.12, transparent: true, opacity: 0.85, depthWrite: false }));
snow.geometry.setAttribute('position', new THREE.Float32BufferAttribute(Array.from({ length: 600 * 3 }, (_, i) => (i % 3 === 0 ? (Math.random() - 0.5) * 30 : i % 3 === 1 ? Math.random() * 14 : -60 + Math.random() * 72)), 3));
snow.visible = false;
scene.add(snow);

// ---------- canvas labels ----------
function canvasTex(w, h) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = 4;
  return { c, ctx: c.getContext('2d'), tex };
}
function fitFont(ctx, text, maxW, size, family) {
  let s = size;
  do { ctx.font = `${s}px ${family}`; s -= 4; } while (ctx.measureText(text).width > maxW && s > 16);
}
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
const FONT = "Bungee, 'Arial Black', Impact, sans-serif";

// ---------- bullets (instanced) ----------
function starGeo() {
  const sh = new THREE.Shape();
  for (let i = 0; i < 10; i++) {
    const r = i % 2 ? 0.5 : 1.25, a = i / 10 * Math.PI * 2 + Math.PI / 2;
    if (i) sh.lineTo(Math.cos(a) * r, Math.sin(a) * r); else sh.moveTo(Math.cos(a) * r, Math.sin(a) * r);
  }
  const g = new THREE.ExtrudeGeometry(sh, { depth: 0.5, bevelEnabled: false });
  g.translate(0, 0, -0.25);
  return g;
}
const SHAPES = {
  orb:   { geo: new THREE.IcosahedronGeometry(1, 1), color: 0xffb400 },

// ---------- health bars ----------
const barBgMat = new THREE.SpriteMaterial({ color: 0x1a1d22, depthTest: false });
const barFgMat = new THREE.SpriteMaterial({ color: 0xff4040, depthTest: false });

// ---------- state ----------
let G, units, enemies, bullets, barrels, gates, pickups, dying, pads, hazards, props;  // props: mode-owned scene objects
let running = false;
const stats = {};
const input = { left: false, right: false, dragging: false, startX: 0, startTarget: 0 };

crowdSprite.scale.set(1.5, 0.68, 1);

function drawCrowdLabel(n) {

function resetGame(mode = 'classic') {
  for (const list of [units, enemies, barrels, gates, pickups, dying, pads, hazards, props]) if (list) for (const o of list) removeObj(o);
  G = { mode, dist: 0, time: 0, kills: 0, peak: 1, crowdX: 0, target: 0, crowdZ: 0, nextAt: 4, script: 0, cycle: 0, rowId: 0, over: false,
        upgradeRows: 0, bossDue: false, bosses: 0, rolls: 0, rollsBroken: 0, rollCooldown: 10,  // first roll shows up once the crew has had time to grow
        nextPad: 0, slots: [], compactT: 0, bossKills: 0, boostT: 0, reserve: 0, endWhy: null, endT: 0 };
  defenseLine.position.z = LINE_Z;
  const M = MODES[mode];
  for (const d of DECOR) d.visible = M.decor === d;
  scene.background.set(M.theme.sky); scene.fog.color.set(M.theme.sky); scene.fog.far = M.theme.fog || 60; deck.material.color.set(M.theme.deck);
  snow.visible = !!M.theme.snow;
  unitMat.color.set(0xffffff);
  Object.assign(stats, { multi: 1, size: 0, diag: 0, rate: 0, dmg: BASE_DMG, spike: 0, bomb: 0, ring: 0, star: 0, weapon: 0 });
  units = []; enemies = []; bullets = []; barrels = []; gates = []; pickups = []; dying = []; pads = []; hazards = []; props = [];
  addUnits(1);
  M.setup();
  drawCrowdLabel(crewCount());
}
function removeObj(o) {
  if (o.mesh) scene.remove(o.mesh);
  if (o.group) scene.remove(o.group);
  if (o.bar) { scene.remove(o.bar.bg); scene.remove(o.bar.fg); }
  if (o.label) scene.remove(o.label);
}

// ---------- derived stats ----------
const mode = () => MODES[G.mode];
const prog = () => mode().progress();
const scrollNow = () => mode().scroll() * (G.boostT > 0 ? 1.6 : 1);
const weapon = () => WEAPONS[stats.weapon];
const fireInterval = () => 2.25 / (1 + 0.22 * stats.rate) / weapon().rate;
const bulletR = () => 0.13 + stats.size * 0.07 + weapon().size;
const firepower = () => Math.max(1, units.length) * stats.multi / fireInterval();

// ---------- units ----------
// Uncapped modes count crew past MAX_UNITS in G.reserve. The drawn crowd stands for the whole crowd, so a hazard that
// fells a drawn member takes its share of the reserve too; reserves refill the drawn crowd on the compaction tick.
const crewCount = () => units.length + G.reserve;
function addUnits(n) {
  const room = MAX_UNITS - units.length;
  const add = Math.min(n, room);
  for (let i = 0; i < add; i++) {
    const mesh = new THREE.Mesh(POSES[0], unitMat);
    mesh.castShadow = true;
    const a = Math.random() * Math.PI * 2;
    const u = { mesh, x: G.crowdX + Math.cos(a) * 0.3, z: G.crowdZ - 0.5 + Math.sin(a) * 0.3, phase: Math.random() * 6, cd: Math.random() * fireInterval(), shot: 0 };
    mesh.position.set(u.x, 0, u.z);
    scene.add(mesh);
    let slot = G.slots.indexOf(null);
    if (slot < 0) slot = G.slots.length;
    G.slots[slot] = u; u.slot = slot;
    units.push(u);
  }
  if (mode().uncapped) G.reserve += n - add;
  else if (add < n && n > 0) toast('Crew is full', '#f5f7f9');
  G.peak = Math.max(G.peak, crewCount());
  return mode().uncapped ? n : add;
}
function dropUnit(u) {
  const i = units.indexOf(u);
  if (i < 0) return false;
  units.splice(i, 1);
  G.slots[u.slot] = null;  // survivors hold their spots; the crowd closes gaps gradually in update()
  while (G.slots.length && !G.slots[G.slots.length - 1]) G.slots.pop();
  return true;
}
function killUnit(u) {
  if (!dropUnit(u)) return;
  dieAnim(u.mesh, Math.random() < 0.5 ? -1 : 1);
}
function hurtCrew(h, u) {
  if (G.reserve > 0) G.reserve = Math.max(0, G.reserve - Math.round(G.reserve / units.length));
  killUnit(u);
}
function removeUnits(n) {
  const r = Math.min(G.reserve, n);
  G.reserve -= r; n -= r;
  for (let i = 0; i < n && units.length; i++) killUnit(units[units.length - 1]);
}
function dieAnim(mesh, dir) {
  dying.push({ mesh, t: 0, dir, rot0: mesh.rotation.x });
}

// ---------- enemies ----------
const bossMat = animeMaterial(0xffffff);
function spawnEnemy(x, z, hp, boss = false, horde = false) {
  const tier = Math.max(0, tierOf(hp));
  const scale = boss ? 2.6 : 1 + tier * 0.12;
  const mesh = new THREE.Mesh(modelGeometries[boss ? 'boss' : 'enemy'][0], boss ? bossMat : tierMats[tier]);
  mesh.rotation.y = Math.PI;
  mesh.scale.setScalar(scale);
  mesh.position.set(x, 0, z);
  scene.add(mesh);
  const e = { mesh, x, z, hp, maxHp: hp, r: 0.32 * scale, walk: enemyWalk(prog()) * (boss ? 0.45 : horde ? 0.25 + Math.random() * 0.1 : 0.85 + Math.random() * 0.3), phase: Math.random() * 6, hitT: 0, scale, steer: 0.3 + Math.min(0.9, prog() / 900), bar: null, boss, barW: boss ? 2.4 : 0.9 };
  if ((hp > stats.dmg && !horde) || boss) {
    const bg = new THREE.Sprite(barBgMat), fg = new THREE.Sprite(barFgMat);
    bg.scale.set(e.barW, boss ? 0.18 : 0.1, 1); fg.scale.set(e.barW - 0.04, boss ? 0.13 : 0.07, 1); fg.center.set(0, 0.5);
    bg.renderOrder = 5; fg.renderOrder = 6;
    scene.add(bg); scene.add(fg);
    e.bar = { bg, fg };
  }
  mesh.castShadow = !horde;
  enemies.push(e);
  return e;
}
const shieldGeo = new THREE.SphereGeometry(0.78, 24, 16);
function spawnBoss(x, armored = false) {
  const k = ++G.bosses;
  const hp = mode().bossHp(k), grow = mode().bossGrow * (k - 1);
  const e = spawnEnemy(x, SPAWN_Z, hp, true);
  if (grow) {
    e.scale = 2.6 + grow; e.r = 0.32 * e.scale; e.barW = 2.4 + grow;
    e.bar.bg.scale.x = e.barW;
  }
  if (armored) {
    // immune until the crew picks up a Boss Breaker
    e.armored = true;
    e.walk *= 0.3;
    e.z = SPAWN_Z - 20;  // starts out in the fog so the breaker roll gets a head start
    e.shield = new THREE.Mesh(shieldGeo, new THREE.MeshLambertMaterial({ color: 0xffc83d, emissive: 0x7a5500, transparent: true, opacity: 0.3, depthWrite: false }));
    e.shield.position.y = 0.62;
    e.mesh.add(e.shield);
    e.shieldT = 0;
    toast(`Boss ${k} of 3 · get the Boss Breaker`, '#ffc83d');
  } else toast(`Boss · ${hp} HP`, '#e8343b');
}
const immune = e => e.armored && !G.breaker;
// close bosses telegraph a red strip where the crew stands, then slam it; strafe out to survive
const slamGeo = new THREE.PlaneGeometry(1, 1);
const SLAM_WINDUP = 1.8;
function bossSlam(e, dt) {
  if (e.z < -18 || !units.length) return;
  e.slamCd = (e.slamCd ?? 1.5) - dt;
  if (!e.slam && e.slamCd <= 0) {
    const x0 = Math.max(-HALF_W, G.crowdX - 1.3), x1 = Math.min(HALF_W, G.crowdX + 1.3), z0 = e.z + e.r;
    const m = new THREE.Mesh(slamGeo, new THREE.MeshBasicMaterial({ color: 0xff2a2a, transparent: true, opacity: 0.3, depthWrite: false }));
    m.rotation.x = -Math.PI / 2;
    m.position.set((x0 + x1) / 2, 0.03, (z0 + LINE_Z + 2) / 2);
    m.scale.set(x1 - x0, LINE_Z + 2 - z0, 1);
    scene.add(m);
    e.slam = { m, t: 0, x0, x1, z0 };
  }
  if (!e.slam) return;
  e.slam.t += dt;
  e.slam.m.material.opacity = 0.18 + 0.22 * (0.5 + 0.5 * Math.sin(e.slam.t * (8 + e.slam.t * 10)));
  if (e.slam.t >= SLAM_WINDUP) {
    for (let j = units.length - 1; j >= 0; j--) { const u = units[j]; if (u.x > e.slam.x0 && u.x < e.slam.x1 && u.z > e.slam.z0) killUnit(u); }
    scene.remove(e.slam.m);
    e.slam = null; e.slamCd = 3.5; e.hitT = 0.12;
  }
}
// enemies never shelter behind something that blocks shots: they wait a clear gap back until it is gone
const COVER_GAP = 16;
const WAVE_SETBACK = 8;  // enemy waves start this much further back than obstacle rows
function holdBehindCover(e, pz) {
  let limit = Infinity;
  for (const b of barrels) {
    if (b.z <= e.z || b.z > G.crowdZ) continue;
    if (Math.abs(e.x - b.x) < (b.roll ? b.R : BARREL_R) + e.r) limit = Math.min(limit, b.z - COVER_GAP);
  }
  for (const g of gates) {
    if (g.done || g.z <= e.z || g.z > G.crowdZ) continue;
    if (e.x > g.x0 - e.r && e.x < g.x1 + e.r) limit = Math.min(limit, g.z - COVER_GAP);
  }
  if (e.z > limit) e.z = Math.min(e.z, Math.max(limit, pz));  // stop advancing; never jump backwards
}
function killEnemy(e) {
  if (e.slam) { scene.remove(e.slam.m); e.slam = null; }
  if (e.armored) G.breaker = false;  // each breaker is spent on one boss
  mode().onKill(e);
  const i = enemies.indexOf(e);
  if (i < 0) return;
  enemies.splice(i, 1);
  if (e.boss) G.bossKills++;
  if (e.bar) { scene.remove(e.bar.bg); scene.remove(e.bar.fg); }
  G.kills++;
  dieAnim(e.mesh, Math.random() < 0.5 ? -1 : 1);
}

// ---------- barrels ----------
function spawnBarrel(side, z, hits, reward, impossible) {
  const group = new THREE.Group();
  const crate = reward === 'WEAPON' && !impossible;
  const body = new THREE.Mesh(modelGeometries[crate ? 'crate' : 'capsule'], impossible ? sealedPropMat : propMat);
  body.castShadow = true; group.add(body);
  const lbl = canvasTex(320, 180);
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: lbl.tex, depthTest: false }));
  sprite.scale.set(3.6, 2.02, 1); sprite.position.y = BARREL_H + 1.35; sprite.renderOrder = 8;
  group.add(sprite);
  const x = side * HALF_W / 2;
  group.position.set(x, 0, z);
  scene.add(group);
  const b = { group, body, x, z, hits, reward, amount: reward === 'UNITS' ? crewBonus(prog()) : 0, impossible, lbl, shake: 0, dirty: true, vz: 0 };
  drawBarrel(b);
  barrels.push(b);
  return b;
}
function drawBarrel(b) {
  const { ctx, c, tex } = b.lbl;
  ctx.clearRect(0, 0, c.width, c.height);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 10; ctx.strokeStyle = '#12161d'; ctx.fillStyle = '#ffffff';
  const t = String(Math.max(0, Math.ceil(b.hits)));
  fitFont(ctx, t, c.width - 30, 92, FONT);
  ctx.strokeText(t, c.width / 2, 64); ctx.fillText(t, c.width / 2, 64);
  const pill = b.reward ? { label: rewardLabel(b.reward, b.amount), color: REWARDS[b.reward].color, ink: b.reward === 'UNITS' ? '#12161d' : '#ffffff' } : b.tag;
  if (pill) {
    ctx.fillStyle = pill.color; roundRect(ctx, 30, 120, c.width - 60, 52, 26); ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = '#12161d'; ctx.stroke();
    ctx.fillStyle = pill.ink;
    fitFont(ctx, pill.label, c.width - 100, 34, FONT); ctx.fillText(pill.label, c.width / 2, 147);
  }
  tex.needsUpdate = true;
  b.dirty = false;
}
function breakBarrel(b) {
  const i = barrels.indexOf(b);
  if (i < 0) return;
  barrels.splice(i, 1);
  scene.remove(b.group);
  burst(b.x, b.z, b.roll ? 0xf7f7f2 : b.impossible ? 0x3b4048 : 0xc8462a);
  if (b.reward) spawnPickup(b.x, b.z, b.reward, b.amount, b.vz);
  if (b.pair) for (const o of barrels.slice()) if (o.pair === b.pair) vanish(o);
  if (b.tag === DAM_TAG) for (const h of hazards) if (h.kind === 'lava') h.front = Math.min(LINE_Z, h.front + LAVA_PUSH);
  if (b.roll && b.reward !== 'BREAKER' && ++G.rollsBroken % 3 === 0 && G.bosses < LANE_BOSS_HP.length) G.breakerDue = true;
}

// a reward the crew passed up: it disappears without paying out
function vanish(b) {
  const i = barrels.indexOf(b);
  if (i < 0) return;
  barrels.splice(i, 1);
  scene.remove(b.group);
  burst(b.x, b.z, 0xd7dde5);
}

// ---------- gates ----------
const FACTORS = [1 / 4, 1 / 3, 1 / 2, 1, 2, 3, 4, 5];  // ×/÷ gate steps; 100 bullets move one step up
const FX = { half: 2, one: 3, x2: 4, x3: 5 };
const factorLabel = f => (f < 1 ? '÷' + Math.round(1 / f) : '×' + f);
// slide = { w, x, lo, hi, v }: a narrower gate whose centre x moves at v between lo and hi
function spawnGate(side, z, value, rowId, op = '+', slide = null) {
  const group = new THREE.Group();
  const span = slide ? slide.w : HALF_W, w = span - 0.15;
  const lbl = canvasTex(320, 160);
  const panel = new THREE.Mesh(new THREE.PlaneGeometry(w, w / 2), new THREE.MeshBasicMaterial({ map: lbl.tex, transparent: true, depthWrite: false, side: THREE.DoubleSide }));
  panel.position.y = 1.55; group.add(panel);
  const postM = new THREE.MeshLambertMaterial({ color: 0xeef1f4 });
  for (const s of [-1, 1]) {
    const post = new THREE.Mesh(new THREE.BoxGeometry(0.18, 2.9, 0.18), postM);
    post.position.set(s * w / 2, 1.45, 0); post.castShadow = true; group.add(post);
  }
  const top = new THREE.Mesh(new THREE.BoxGeometry(w + 0.18, 0.16, 0.18), postM);
  top.position.y = 2.9; group.add(top);
  const cx = slide ? slide.x : side * HALF_W / 2;
  group.position.set(cx, 0, z);
  scene.add(group);
  const g = { group, panel, side, cx, span, x0: cx - span / 2, x1: cx + span / 2, z, pz: z, op, value, rowId, lbl, done: false, fade: 0, dirty: true, pulse: 0, prog: 0, vz: 0,
              vx: slide ? slide.v : 0, lo: slide && slide.lo, hi: slide && slide.hi };
  drawGate(g);
  gates.push(g);
  return g;
}
const crowdIn = g => G.crowdX >= g.x0 && G.crowdX < g.x1;
const GATE_TONE = { up: 'rgba(47,140,255,0.72)', times: 'rgba(124,77,255,0.75)', down: 'rgba(232,52,59,0.72)', flat: 'rgba(150,160,170,0.6)', heat: 'rgba(255,122,0,0.8)' };
// each door kind: shots needed per step, what a step does, how it reads, and what walking through does
const GATE_OPS = {
  '+': {
    cost: GATE_BULLETS,
    up: v => v + 1,
    text: v => (v > 0 ? '+' : '') + v,
    tone: v => (v > 0 ? GATE_TONE.up : v < 0 ? GATE_TONE.down : GATE_TONE.flat),
    apply(v) {
      if (v > 0) { const n = addUnits(v); if (n) toast(`+${n} crew`, '#2f8cff'); }
      else if (v < 0) { const n = Math.min(crewCount(), -v); removeUnits(n); toast(`−${n} crew`, '#e8343b'); }
    },
  },
  x: {
    cost: GATE_BULLETS * 2,
    up: v => Math.min(FACTORS.length - 1, v + 1),
    text: v => factorLabel(FACTORS[v]),
    tone: v => (FACTORS[v] > 1 ? GATE_TONE.times : FACTORS[v] < 1 ? GATE_TONE.down : GATE_TONE.flat),
    apply(v) {
      const f = FACTORS[v], n0 = crewCount(), diff = Math.round(n0 * f) - n0;
      if (diff > 0) addUnits(diff); else if (diff < 0) removeUnits(Math.min(n0, -diff));
      toast(`${factorLabel(f)} → ${diff >= 0 ? '+' : '−'}${Math.abs(diff)} crew`, diff >= 0 ? '#7c4dff' : '#e8343b');
    },
  },
  heat: {  // Whiteout heaters: refill the heat bar instead of the crew
    cost: GATE_BULLETS,
    up: v => v + 5,
    text: v => `+${v}`,
    tone: () => GATE_TONE.heat,
    icon: (ctx, x, y) => flameIcon(ctx, x, y, 34),
    apply(v) { G.heat = Math.min(HEAT_MAX, G.heat + v); toast(`+${v} heat`, '#ff7a00'); },
  },
};
function flameIcon(ctx, x, y, r) {
  ctx.fillStyle = '#ffd23d'; ctx.strokeStyle = 'rgba(18,22,29,0.8)'; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.moveTo(x, y - r * 1.3);
  ctx.bezierCurveTo(x + r * 0.9, y - r * 0.3, x + r, y + r * 0.5, x, y + r);
  ctx.bezierCurveTo(x - r, y + r * 0.5, x - r * 0.9, y - r * 0.3, x, y - r * 1.3);
  ctx.stroke(); ctx.fill();
}
function drawGate(g) {
  const { ctx, c, tex } = g.lbl, O = GATE_OPS[g.op];
  ctx.clearRect(0, 0, c.width, c.height);
  ctx.fillStyle = O.tone(g.value);
  ctx.fillRect(0, 0, c.width, c.height);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const t = O.text(g.value), tx = O.icon ? c.width / 2 + 30 : c.width / 2;
  fitFont(ctx, t, c.width - (O.icon ? 120 : 40), 96, FONT);
  ctx.lineWidth = 8; ctx.strokeStyle = 'rgba(18,22,29,0.8)'; ctx.strokeText(t, tx, c.height / 2 - 6);
  ctx.fillStyle = '#fff'; ctx.fillText(t, tx, c.height / 2 - 6);
  if (O.icon) O.icon(ctx, tx - ctx.measureText(t).width / 2 - 42, c.height / 2 - 6);
  ctx.fillStyle = 'rgba(18,22,29,0.55)'; roundRect(ctx, 24, c.height - 30, c.width - 48, 14, 7); ctx.fill();
  if (g.prog > 0) { ctx.fillStyle = '#ffffff'; roundRect(ctx, 24, c.height - 30, Math.max(14, (c.width - 48) * g.prog / gateCost(g)), 14, 7); ctx.fill(); }
  tex.needsUpdate = true;
  g.dirty = false;
}
const gateCost = g => mode().gateCost(g);
function applyGate(g) {
  for (const o of gates) if (o.rowId === g.rowId) o.done = true;
  g.pulse = 1;
  GATE_OPS[g.op].apply(g.value);
}

// ---------- pickups ----------
const pickupGeo = new THREE.OctahedronGeometry(0.55, 0);
function spawnPickup(x, z, kind, amount, vz = 0) {
  const group = new THREE.Group();
  const col = new THREE.Color(REWARDS[kind].color);
  const shape = REWARDS[kind].shape;
  const gem = new THREE.Mesh(shape ? SHAPES[shape].geo : pickupGeo, new THREE.MeshLambertMaterial({ color: col, emissive: col.clone().multiplyScalar(0.45) }));
  if (shape) gem.scale.setScalar(0.42);
  gem.position.y = 0.9; group.add(gem);
  const lbl = canvasTex(256, 72);
  const ctx = lbl.ctx;
  ctx.fillStyle = 'rgba(18,22,29,0.85)'; roundRect(ctx, 4, 4, 248, 64, 30); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const label = rewardLabel(kind, amount);
  fitFont(ctx, label, 220, 36, FONT); ctx.fillText(label, 128, 38);
  lbl.tex.needsUpdate = true;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: lbl.tex, depthTest: false }));
  sp.scale.set(2.2, 0.62, 1); sp.position.y = 2.0; sp.renderOrder = 9; group.add(sp);
  group.position.set(x, 0, z);
  scene.add(group);
  pickups.push({ group, gem, x, z, kind, amount, t: 0, vz });
}
function rewardLabel(kind, amount) {
  const R = REWARDS[kind];
  if (kind === 'UNITS') return `+${amount} CREW`;
  if (kind === 'WEAPON') return WEAPONS[Math.min(WEAPONS.length - 1, stats.weapon + 1)].name.toUpperCase();
  if (kind === 'DIAG' && stats.diag > 0) return 'DIAGONAL+';
  if (R.shape && stats[R.shape] > 0) return R.label + '+';
  return R.label;
}
function applyReward(kind, amount) {
  const label = rewardLabel(kind, amount);
  if (REWARDS[kind].shape) stats[REWARDS[kind].shape]++;
  switch (kind) {
    case 'MULTI': stats.multi++; break;
    case 'DIAG': stats.diag++; break;
    case 'SIZE': stats.size++; break;
    case 'RATE': stats.rate++; break;
    case 'DMG': stats.dmg += 5; break;
    case 'UNITS': addUnits(amount); break;
    case 'BREAKER': G.breaker = true; break;
    case 'WEAPON': stats.weapon = Math.min(WEAPONS.length - 1, stats.weapon + 1); break;
    case 'HEAT': G.heat = Math.min(HEAT_MAX, G.heat + 60); break;
    case 'REPAIR': G.wallHp = Math.min(WALL_HP, G.wallHp + 200); break;
  }
  toast(label, REWARDS[kind].color);

}

function lanesDirector(dt) {
  if (!G.filled) {  // start with the lanes already stocked: +1 gates, a roll, and the horde already close
    G.filled = true;
    for (let z = -5; z > SPAWN_Z; z -= 3) spawnPad(LANE_X, z);
    spawnHordePack(15, HORDE_FIRST_Z, 1);
    spawnHordePack(15, HORDE_FIRST_Z - 12, 1);
  }
  const p = prog();
  if (G.dist >= G.nextAt) {  // horde pack down the middle
    const n = Math.min(200, 15 * (2 + Math.floor(p / 120) + rint(0, 1)), HORDE_MAX - enemies.length);
    spawnHordePack(n, SPAWN_Z, enemyHp(p));
    G.nextAt += Math.max(8, 18 - p / 40);  // dense packs, spaced out so the crew can clear each one
  }
  while (G.dist >= G.nextPad) { spawnPad(LANE_X, SPAWN_Z); G.nextPad += 3; }
  if (!barrels.some(b => b.roll)) {  // one toilet roll at a time down the left
    const armoredAlive = enemies.some(e => e.armored);
    const needBreaker = G.breakerDue || (armoredAlive && !G.breaker && !pickups.some(p => p.kind === 'BREAKER'));
    if (needBreaker) {
      // the roll that carries the Boss Breaker is a bit softer so it can be cracked before the boss arrives
      spawnRoll(-LANE_X, SPAWN_Z, Math.round(rollHp(Math.max(1, G.rolls)) * 0.6), 'BREAKER');
      if (G.breakerDue) { G.breakerDue = false; spawnBoss(0, true); }
      G.rollCooldown = 3;
    } else {
      G.rollCooldown -= dt;
      if (G.rollCooldown <= 0) { spawnRoll(-LANE_X, SPAWN_Z, rollHp(++G.rolls), pickReward('UNITS')); G.rollCooldown = 3; }
    }
  }
}

  if (G.mode !== 'cannon' || G.charge < CHARGE_FULL || !running) return;

const END = {

for (const k in MODES) MODES[k] = { ...MODE_BASE, ...MODES[k] };

// ---------- update ----------
function update(dt) {
  G.time += dt;
  G.boostT = Math.max(0, G.boostT - dt);
  const scroll = scrollNow();
  G.dist += scroll * dt;
  const M = mode();
  M.director(dt);
  M.update(dt);

  // crowd
  if (input.left) G.target -= 3 * dt;
  if (input.right) G.target += 3 * dt;
  G.target = Math.max(-HALF_W, Math.min(HALF_W, G.target));
  const n = units.length;
  G.compactT -= dt;
  if (G.compactT <= 0) {  // pull the outermost member into the innermost gap, one at a time
    G.compactT = 0.3;
    const hole = G.slots.indexOf(null);
    if (hole >= 0) {
      const u = G.slots.pop(); G.slots[hole] = u; u.slot = hole;
      while (G.slots.length && !G.slots[G.slots.length - 1]) G.slots.pop();
    }
    if (G.reserve > 0 && units.length < MAX_UNITS) { const k = Math.min(G.reserve, MAX_UNITS - units.length); G.reserve -= k; addUnits(k); }
  }
  const R = SLOT * Math.sqrt(Math.max(0, G.slots.length - 1)) + 0.25;
  const xs = Math.min(1, 3.6 / R), zs = 1 / xs;
  const lim = Math.max(0, HALF_W - 0.35 - R * xs);
  G.crowdX += (Math.max(-lim, Math.min(lim, G.target)) - G.crowdX) * Math.min(1, dt * 10 / 3);
  const crowdTarget = M.walledLanes ? Math.max(0, R * zs - 2.4) : -Math.max(0, R * zs - 2.4);  // lanes: grow backwards, clear of the walls
  G.crowdZ += (crowdTarget - G.crowdZ) * Math.min(1, dt * 3);
  for (let i = 0; i < n; i++) {
    const u = units[i];
    const r = SLOT * Math.sqrt(u.slot), th = u.slot * 2.39996;
    const sx = G.crowdX + Math.cos(th) * r * xs, sz = G.crowdZ + Math.sin(th) * r * zs;
    u.x += (sx - u.x) * Math.min(1, dt * 8);
    u.z += (sz - u.z) * Math.min(1, dt * 8);
    u.x = Math.max(-HALF_W + 0.25, Math.min(HALF_W - 0.25, u.x));
    if (M.walledLanes) u.z = Math.max(LANE_WALL_END + 0.5, u.z);
    u.phase += dt * 9;
    u.mesh.geometry = poseFor(u.phase);
    u.mesh.position.set(u.x, 0, u.z);
    u.cd -= dt;
    if (u.cd <= 0 && M.shooting) { u.cd += fireInterval(); shoot(u); }
  }

  // enemies
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    const pz = e.z;
    e.z += (scroll + M.march + e.walk) * dt;
    if (e.z > -22 && n) e.x += Math.max(-1, Math.min(1, G.crowdX - e.x)) * e.steer * dt;
    const ex = M.walledLanes && e.z < LANE_WALL_END ? LANE_EDGE - LANE_WALL_T - e.r : HALF_W - 0.35;  // walled middle lane
    e.x = Math.max(-ex, Math.min(ex, e.x));
    if (M.cover) holdBehindCover(e, pz);
    e.phase += dt * (7 + e.walk * 3);
    e.hitT = Math.max(0, e.hitT - dt);
    e.mesh.geometry = poseFor(e.phase, e.boss ? 'boss' : 'enemy');
    e.mesh.position.set(e.x, 0, e.z);
    e.mesh.scale.setScalar(e.scale * (1 + e.hitT * 2.5));
    if (e.boss) bossSlam(e, dt);
    if (e.shield) {
      e.shieldT = Math.max(0, e.shieldT - dt);
      e.shield.visible = !G.breaker;
      e.shield.material.opacity = 0.28 + e.shieldT * 2.5;
    }
    if (e.bar) {
      const w = e.barW - 0.04, y = (e.boss ? 1.45 : 1.55) * e.scale;
      e.bar.bg.position.set(e.x, y, e.z);
      e.bar.fg.position.set(e.x - w / 2, y, e.z);
      e.bar.fg.scale.x = w * Math.max(0, e.hp / e.maxHp);
    }
    const reach = e.r + 0.18;
    for (let j = units.length - 1; j >= 0; j--) {
      const u = units[j], dx = u.x - e.x, dz = u.z - e.z;
      if (dx * dx + dz * dz < reach * reach) {
        killUnit(u);
        if (!immune(e)) e.hp -= CONTACT_DMG;
        if (e.hp <= 0) { killEnemy(e); break; }
      }
    }
    if (enemies[i] === e && e.z > LINE_Z && M.breach(e)) return gameOver('line');
  }

  // barrels
  for (let i = barrels.length - 1; i >= 0; i--) {
    const b = barrels[i];
    b.z += (scroll + b.vz) * dt;
    b.shake = Math.max(0, b.shake - dt);
    b.group.position.set(b.x + (b.shake ? (Math.random() - 0.5) * 0.12 : 0), 0, b.z);
    if (b.roll) updateRoll(b, dt);
    if (b.dirty) drawBarrel(b);
    const reach = (b.roll ? b.R : BARREL_R) + 0.18;
    for (let j = units.length - 1; j >= 0; j--) {
      const u = units[j], dx = u.x - b.x, dz = u.z - b.z;
      if (dx * dx + dz * dz < reach * reach) killUnit(u);
    }
    if (b.z > 16) { scene.remove(b.group); barrels.splice(i, 1); }
  }

  // gates
  for (let i = gates.length - 1; i >= 0; i--) {
    const g = gates[i];
    g.pz = g.z;
    g.z += (scroll + g.vz) * dt;
    if (g.vx) {
      g.cx += g.vx * dt;
      if (g.cx < g.lo || g.cx > g.hi) { g.cx = Math.max(g.lo, Math.min(g.hi, g.cx)); g.vx = -g.vx; }
      g.x0 = g.cx - g.span / 2; g.x1 = g.cx + g.span / 2;
    }
    if (!g.done && g.z >= G.crowdZ && n) {
      if (crowdIn(g)) applyGate(g);
      else if (!gates.some(o => o.rowId === g.rowId && !o.done && crowdIn(o))) for (const o of gates) if (o.rowId === g.rowId) o.done = true;
    }
    if (g.dirty) drawGate(g);
    if (g.done) g.fade = Math.min(1, g.fade + dt * 2);
    g.pulse = Math.max(0, g.pulse - dt * 2);
    g.panel.material.opacity = 1 - g.fade * 0.75;
    g.group.position.set(g.cx, 0, g.z);
    g.group.scale.setScalar(1 + g.pulse * 0.15);
    if (g.z > 16) { scene.remove(g.group); gates.splice(i, 1); }
  }

  // hazards
  for (let i = hazards.length - 1; i >= 0; i--) {
    const h = hazards[i], H = HAZARDS[h.kind];
    h.t += dt;
    H.update(h, dt, scroll);
    if (H.hits) for (let j = units.length - 1; j >= 0 && !h.gone; j--) if (H.hits(h, units[j])) (H.touch || hurtCrew)(h, units[j]);
    if (h.gone || h.z > 16) { removeObj(h); hazards.splice(i, 1); }
  }

  // +1 pads
  for (let i = pads.length - 1; i >= 0; i--) {
    const p = pads[i];
    p.z += scroll * dt;
    p.group.position.z = p.z;
    let got = false;
    for (const u of units) if (Math.abs(u.x - p.x) < PLUS_W / 2 && Math.abs(u.z - p.z) < 0.4) { got = true; break; }
    if (got) { addUnits(1); scene.remove(p.group); pads.splice(i, 1); }
    else if (p.z > 12) { scene.remove(p.group); pads.splice(i, 1); }
  }

  // pickups
  for (let i = pickups.length - 1; i >= 0; i--) {
    const p = pickups[i];
    p.z += (scroll * (p.kind === 'BREAKER' ? 2.5 : 1) + p.vz) * dt; p.t += dt;
    p.gem.rotation.y += dt * 2.5;
    p.gem.position.y = 0.9 + Math.sin(p.t * 4) * 0.15;
    p.group.position.set(p.x, 0, p.z);
    let got = false;
    for (const u of units) { const dx = u.x - p.x, dz = u.z - p.z; if (dx * dx + dz * dz < 1.3 * 1.3) { got = true; break; } }
    if (got) { applyReward(p.kind, p.amount); scene.remove(p.group); pickups.splice(i, 1); }
    else if (p.z > 12) { scene.remove(p.group); pickups.splice(i, 1); }
  }

  // bullets
  for (let i = 0; i < bullets.length; i++) {
    const b = bullets[i];
    const ox = b.x, oz = b.z;
    b.x += b.vx * dt; b.z += b.vz * dt; b.life -= dt;
    if (b.x - b.r < -HALF_W) { b.x = 2 * (-HALF_W + b.r) - b.x; b.vx = -b.vx; }
    else if (b.x + b.r > HALF_W) { b.x = 2 * (HALF_W - b.r) - b.x; b.vx = -b.vx; }
    if (M.walledLanes && b.z < LANE_WALL_END) {
      if (b.lane === undefined) b.lane = b.x < -LANE_EDGE ? -1 : b.x > LANE_EDGE ? 1 : 0;
      const lo = b.lane < 0 ? -HALF_W : b.lane === 0 ? -LANE_EDGE + LANE_WALL_T : LANE_EDGE + LANE_WALL_T;
      const hi = b.lane > 0 ? HALF_W : b.lane === 0 ? LANE_EDGE - LANE_WALL_T : -LANE_EDGE - LANE_WALL_T;
      if (b.x - b.r < lo) { b.x = Math.min(hi - b.r, 2 * (lo + b.r) - b.x); b.vx = Math.abs(b.vx); }
      else if (b.x + b.r > hi) { b.x = Math.max(lo + b.r, 2 * (hi - b.r) - b.x); b.vx = -Math.abs(b.vx); }
    } else b.lane = undefined;
    let dead = b.life <= 0 || b.z < SPAWN_Z - 5;
    if (!dead) for (const br of barrels) {
      if (Math.abs(br.z - b.z) > BARREL_R + 2) continue;
      const rr = (br.roll ? br.R : BARREL_R) + b.r;
      if (segDist2(ox, oz, b.x, b.z, br.x, br.z) < rr * rr) {
        br.hits -= br.roll ? stats.dmg * b.dmgMul * weapon().dmg * ROLL_DMG_SCALE : 1;
        br.dirty = true; br.shake = 0.1; dead = true;
        if (br.roll) { br.spin = 7; if (Math.random() < 0.15 && bits.length < 30) flake(br.x, br.z + br.R); }
        if (br.hits <= 0) breakBarrel(br);
        break;
      }
    }
    if (!dead) for (const h of hazards) {
      const H = HAZARDS[h.kind];
      if (!h.gone && H.blocksShot && H.blocksShot(h, b)) { if (H.onShot) H.onShot(h, b); dead = true; break; }
    }
    if (!dead) for (const g of gates) {
      if (g.done) continue;
      if (oz - g.pz > 0 && b.z - g.z <= 0 && b.x >= g.x0 && b.x <= g.x1) {
        if (++g.prog >= gateCost(g)) { g.prog = 0; g.value = GATE_OPS[g.op].up(g.value); g.pulse = 0.5; }
        g.dirty = true; dead = true; break;
      }
    }
    if (!dead) {
      for (const e of enemies) {
        if (e.hp <= 0 || Math.abs(e.z - b.z) > 2.5) continue;
        if (b.hit && b.hit.includes(e)) continue;
        const rr = e.r + b.r;
        if (segDist2(ox, oz, b.x, b.z, e.x, e.z) < rr * rr && hitEnemy(b, e)) { dead = true; break; }
      }
      flushKills();
    }
    if (dead) { bullets[i] = bullets[bullets.length - 1]; bullets.pop(); i--; }
  }

  if (G.endWhy && (G.endT -= dt) <= 0) return gameOver(G.endWhy);
  if (!crewCount()) return gameOver('crew');
}

function animate(dt) {
  // dying figures fall over
  for (let i = dying.length - 1; i >= 0; i--) {
    const d = dying[i];
    d.t += dt;
    const k = Math.min(1, d.t / 0.3);
    d.mesh.rotation.z = d.dir * k * Math.PI / 2;
    d.mesh.position.y = -Math.max(0, d.t - 0.5) * 2;
    if (running) d.mesh.position.z += scrollNow() * dt;
    if (d.t > 0.9) { scene.remove(d.mesh); dying.splice(i, 1); }
  }
  for (let i = bits.length - 1; i >= 0; i--) {
    const p = bits[i];
    p.t += dt; p.vy -= (p.float ? 4 : 18) * dt;
    if (p.float && running) p.m.position.z += scrollNow() * dt;
    p.m.position.x += p.vx * dt; p.m.position.y += p.vy * dt; p.m.position.z += p.vz * dt;
    p.m.rotation.x += dt * 5;
    if (p.t > 1.2) { scene.remove(p.m); bits.splice(i, 1); }
  }
  if (running) {
    const scroll = scrollNow();
    for (const mv of movers) { mv.m.position.z += scroll * dt; if (mv.m.position.z > 22) mv.m.position.z -= mv.wrap; }
  }
  if (snow.visible) {
    const p = snow.geometry.attributes.position, a = p.array, sz = running ? scrollNow() : 0, now = performance.now() / 1000;
    for (let i = 0; i < a.length; i += 3) {
      a[i + 1] -= dt * 1.6; a[i + 2] += sz * dt; a[i] += Math.sin(now * 0.7 + i) * dt * 0.3;
      if (a[i + 1] < 0) a[i + 1] += 14;
      if (a[i + 2] > 12) a[i + 2] -= 72;
    }
    p.needsUpdate = true;
  }
  // bullets → instances, one instanced mesh per shape
  const t = performance.now() / 1000;
  const counts = { orb: 0, spike: 0, bomb: 0, ring: 0, star: 0 };
  for (const b of bullets) {
    const i = counts[b.shape]++;
    dummy.position.set(b.x, BULLET_Y, b.z);
    dummy.scale.setScalar(b.r);
    const spin = t * 7 + b.seed;
    if (b.shape === 'spike') dummy.rotation.set(-Math.PI / 2, Math.atan2(-b.vx, -b.vz), 0, 'YXZ');
    else if (b.shape === 'bomb') dummy.rotation.set(spin, spin * 0.7, 0, 'XYZ');

  }
  for (const k in SHAPES) { SHAPES[k].mesh.count = counts[k]; SHAPES[k].mesh.instanceMatrix.needsUpdate = true; }
  for (const b of booms) {
    if (b.t >= 0.3) { b.m.visible = false; continue; }
    b.t += dt;
    b.m.scale.setScalar(b.R * Math.min(1, b.t / 0.12));
    b.m.material.opacity = 0.55 * Math.max(0, 1 - b.t / 0.3);
  }

  // line pulses when enemies get close
  let near = 0;
  for (const e of enemies) near = Math.max(near, 1 - Math.min(1, (LINE_Z - e.z) / 12));
  lineMat.color.setRGB(1, 0.16 + 0.5 * near * (0.5 + 0.5 * Math.sin(performance.now() / 80)), 0.16);

  // crowd label + camera
  if (units && units.length && mode().crowdTag) {
    crowdSprite.visible = true;
    crowdSprite.position.set(G.crowdX, 2.3, G.crowdZ - 0.2);

  const cx = G ? G.crowdX * 0.35 : 0;
  camera.position.x += (cx - camera.position.x) * Math.min(1, dt * 4);
  camera.position.y = camBaseY; camera.position.z = camBaseZ;

}

// ---------- HUD ----------
const $ = id => document.getElementById(id);
const toastsEl = $('toasts');
function toast(text, color, big = false) {
  const el = document.createElement('div');
  el.className = big ? 'toast big' : 'toast'; el.textContent = text; el.style.color = color;
  toastsEl.appendChild(el);

  while (toastsEl.children.length > 3) toastsEl.firstChild.remove();
}
let lastHud = '';
function hud() {

  const s = `${lead}|${sub}|${big}|${small}|${m ? `${m.label}|${Math.round(m.frac * 100)}|${m.color}` : ''}`;
  if (s === lastHud) return;

  $('meter').hidden = !m;
  if (m) { $('meterLabel').textContent = m.label; $('meterFill').style.width = `${Math.max(0, Math.min(1, m.frac)) * 100}%`; $('meterFill').style.background = m.color; }
  $('hudUnits').textContent = lead;
  $('hudDist').textContent = big;
  $('hudKills').textContent = small;
  $('hudWeapon').textContent = sub;
}

function gameOver(why) {
  running = false;
  G.over = true;
  const M = mode(), [title, reason] = M.endText(why), s = M.score(), [again, big] = M.again(why);
  $('againBtn').textContent = again;
  $('againBtn').classList.toggle('big', big);
  $('endTitle').textContent = title;
  $('endReason').textContent = reason;
  $('endStats').replaceChildren(...M.endStats(s).map(([v, label]) => {
    const d = document.createElement('div'), b = document.createElement('b'), sp = document.createElement('span');
    b.textContent = v; sp.textContent = label; d.append(b, sp);
    return d;
  }));
  if (s.n > (readBest(G.mode)?.n ?? -Infinity)) writeBest(G.mode, s);
  const shapes = SHAPE_KEYS.filter(k => stats[k] > 0).map(k => `${k} ${stats[k]}`);
  $('endBuild').textContent = `Build: ${weapon().name} · ${stats.multi} shot · ${stats.diag} diagonal · size ${stats.size} · rate ${stats.rate} · ${stats.dmg} dmg` + (shapes.length ? ` · ${shapes.join(' · ')}` : '');
  $('hud').hidden = true; $('meter').hidden = true; $('champBtn').hidden = true;
  $('endModal').hidden = false;

}
let lastMode = 'classic';
function start(mode = lastMode) {

  resetGame(mode);
  $('startModal').hidden = true; $('endModal').hidden = true;
  $('hud').hidden = false;
  lastHud = '';
  running = true;
}
const readBest = m => load(`htb.best.${m}`);
const writeBest = (m, s) => save(`htb.best.${m}`, { n: s.n, text: s.text, label: s.label });
function buildModeGrid() {
  $('modeGrid').replaceChildren(...Object.entries(MODES).map(([key, M], i) => {
    const b = document.createElement('button'), best = readBest(key);
    b.className = i % 2 ? 'go alt' : 'go';
    b.textContent = M.label;
    if (best) { const sm = document.createElement('small'); sm.textContent = `Best ${best.text} ${best.label.toLowerCase()}`; b.append(sm); }
    b.addEventListener('click', () => start(key));
    return b;
  }));
}
buildModeGrid();
$('againBtn').addEventListener('click', () => start());
$('menuBtn').addEventListener('click', () => { buildModeGrid(); $('endModal').hidden = true; $('startModal').hidden = false; $('modeGrid').firstChild.focus(); });

// ---------- input ----------
const canvas = renderer.domElement;
canvas.addEventListener('pointerdown', e => {
  input.dragging = true; input.startX = e.clientX; input.startTarget = G ? G.target : 0;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  if (!input.dragging || !G) return;
  const perPx = (HALF_W * 2 * 1.25) / Math.min(window.innerWidth, 900);
  G.target = Math.max(-HALF_W, Math.min(HALF_W, input.startTarget + (e.clientX - input.startX) * perPx));
});
const endDrag = () => { input.dragging = false; };
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
$('champBtn').addEventListener('click', () => fireChampion());
window.addEventListener('keydown', e => {
  if (e.key === ' ') fireChampion();
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') input.left = true;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') input.right = true;
});
window.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') input.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') input.right = false;
});
window.addEventListener('blur', () => { input.left = input.right = false; });

// ---------- loop ----------
resetGame();
let last = performance.now();
const TIME_SCALE = Number(new URLSearchParams(location.search).get('speed')) || 1;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (running) { for (let s = 0; s < GAME_SPEED * TIME_SCALE && running; s++) update(dt); if (running) hud(); }
  animate(dt * GAME_SPEED);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__game = { start, step(n, dt = 1 / 60) { for (let i = 0; i < n && running; i++) update(dt); }, addUnits: n => addUnits(n), spawnBoss, spawnEnemy, spawnHazard: (kind, ...a) => HAZARDS[kind].spawn(...a), hazardRow: (kind, z = SPAWN_Z) => HAZARDS[kind].row(z), get hazards() { return hazards; }, get G() { return G; }, stats, get units() { return units; }, get enemies() { return enemies; }, get bullets() { return bullets; }, get gates() { return gates; }, get barrels() { return barrels; }, get pickups() { return pickups; }, get props() { return props; } };
})();
</script>
