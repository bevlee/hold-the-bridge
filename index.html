<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hold the Bridge</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed WebGL bridge, thin HUD strips pinned to the top and bottom, modal cards for start / game over. Single daytime look. */
:root {
  --sky: #c9c9ee;
  --ink: #12161d;
  --paper: #f5f7f9;
  --panel: rgba(32, 41, 66, 0.90);
  --good: #43dcd0;
  --bad: #e8343b;
  --gold: #ffc83d;
  --muted: #9aa6b4;
  --display: 'Bungee', 'Arial Black', Impact, system-ui, sans-serif;
  --body: 'Chakra Petch', ui-sans-serif, system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0; overflow: hidden; background: var(--sky); color: var(--paper);
  font-family: var(--body); touch-action: none; user-select: none; -webkit-user-select: none;
}
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; }

.hud-top {
  position: fixed; left: 0; right: 0; top: 0; pointer-events: none;
  padding-top: calc(10px + env(safe-area-inset-top, 0px)); padding-bottom: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
}
.stat { background: var(--panel); border-radius: 10px; padding: 6px 12px; display: grid; gap: 0; min-width: 0; }
.stat b { font-family: var(--display); font-weight: 400; font-size: 22px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.stat.right { text-align: right; }

#toasts { position: fixed; left: 0; right: 0; top: 30%; display: grid; justify-items: center; gap: 6px; pointer-events: none; }
.toast {
  font-family: var(--display); font-size: clamp(20px, 5vw, 34px); color: var(--paper);
  -webkit-text-stroke: 1.5px var(--ink); paint-order: stroke fill; text-shadow: 0 3px 0 var(--ink);
  animation: toast 1.4s ease-out forwards;
}
@keyframes toast { 0% { transform: translateY(14px) scale(.8); opacity: 0 } 15% { transform: none; opacity: 1 } 70% { opacity: 1 } 100% { transform: translateY(-30px); opacity: 0 } }
@media (prefers-reduced-motion: reduce) { .toast { animation-duration: 2s; animation-name: toastFade } @keyframes toastFade { 0%,80% { opacity: 1 } 100% { opacity: 0 } } }

.modal {
  position: fixed; inset: 0; display: grid; place-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px; background: rgba(10, 14, 20, 0.35);
}
.card {
  background: var(--panel); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  border-radius: 16px; padding: 22px 22px 20px; width: min(440px, 100%); display: grid; gap: 14px;
}
.card h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(30px, 8vw, 44px); line-height: 1; text-wrap: balance; }
.card h1 em { font-style: normal; color: var(--bad); }
.card p { margin: 0; line-height: 1.45; color: #d7dde5; }
.endstats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.endstats div { display: grid; }
.endstats b { font-family: var(--display); font-weight: 400; font-size: 24px; font-variant-numeric: tabular-nums; }
.endstats span { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
button.go {
  font-family: var(--display); font-size: 20px; padding: 12px 18px; border: 0; border-radius: 12px; cursor: pointer;
  background: var(--paper); color: var(--ink); box-shadow: 0 4px 0 #8b96a3; transition: transform .1s, box-shadow .1s;
}
button.go:active { transform: translateY(3px); box-shadow: 0 1px 0 #8b96a3; }
button.go:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.kbd { font-size: 12px; color: var(--muted); }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.modes .go { font-size: 17px; padding-inline: 10px; }
button.go.alt { background: var(--gold); box-shadow: 0 4px 0 #a37a12; }
button.go.alt:active { box-shadow: 0 1px 0 #a37a12; }
</style>

<div id="stage"></div>

<div class="hud-top" id="hud" hidden>
  <div class="stat"><b id="hudUnits">1</b><span id="hudWeapon">Crew · Pistol</span></div>
  <div class="stat right"><b id="hudDist">0 m</b><span id="hudKills">0 down</span></div>
</div>
<div id="toasts"></div>

<div class="modal" id="startModal">
  <div class="card">
    <h1>Hold the <em>Bridge</em></h1>
    <div class="modes">
      <button class="go" id="startClassic">Classic</button>
      <button class="go alt" id="startLanes">Three lanes</button>
    </div>
  </div>
</div>

<div class="modal" id="endModal" hidden>
  <div class="card">
    <h1 id="endTitle">Line broken</h1>
    <p id="endReason"></p>
    <div class="endstats">
      <div><b id="endDist">0</b><span>Metres</span></div>
      <div><b id="endKills">0</b><span>Enemies</span></div>
      <div><b id="endPeak">1</b><span>Peak crew</span></div>
    </div>
    <p class="kbd" id="endBuild"></p>
    <div class="modes">
      <button class="go" id="againBtn">Run it back</button>
      <button class="go alt" id="menuBtn">Change mode</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="assets/anime/models.js"></script>
<script>
(() => {
// ---------- tuning ----------
const HALF_W = 5;            // inner half-width of the deck (walls at ±HALF_W)
const BARREL_R = 2.42;       // two barrels span the deck
const BARREL_H = 2.5;
const LINE_Z = 3.4;          // the red line behind the crew
const SPAWN_Z = -55;          // how far ahead things appear (visible bridge length)
const LANE_X = HALF_W * 2 / 3;  // lane centres in three-lanes mode
const LANE_EDGE = HALF_W / 3;   // lane walls sit at ±LANE_EDGE
const LANE_WALL_T = 0.16;       // half thickness of a lane wall
const LANE_WALL_END = -3;       // lane walls stop here so the crew can cross between lanes
const GAME_SPEED = 2;        // simulation runs this many fixed steps per frame
const MAX_UNITS = 120;
const MAX_BULLETS = 3500;
const BULLET_Y = 0.62;
const BASE_DMG = 10;
const CONTACT_DMG = 10;      // hp an enemy loses for each crew member it kills
const GATE_BULLETS = 50;     // bullets needed to raise a gate by +1
const RANGE = 28;            // bullet travel distance (also caps how long a gate can be farmed)
const SLOT = 0.34;           // crowd packing spacing

const scrollSpeed = d => 2.4 + 1.8 * (1 - Math.exp(-d / 900));
const bulletSpeed = d => 7 + 15 * (1 - Math.exp(-d / 400));
const enemyHp = d => d < 60 ? 1 : Math.round(1 + d / 45 + 10 * Math.pow(d / 350, 2));
const crewBonus = d => 1 + Math.floor(d / 500);   // +crew barrels start at +1 and climb slowly
const bossHp = k => Math.round(150 * Math.pow(k, 1.6));
// left-lane toilet rolls: each takes longer than the last, and the ninth (the last before boss 3) is a wall
const ROLL_HP = [80, 150, 250, 400, 600, 850, 1200, 1700, 4000];
const rollHp = k => ROLL_HP[Math.min(k, ROLL_HP.length) - 1] * (k > ROLL_HP.length ? 1.3 ** (k - ROLL_HP.length) : 1);
const LANE_BOSS_HP = [800, 2000, 4500];  // three-lanes mode ends when the third boss falls
const ROLL_DMG_SCALE = 0.15;             // shots do 15% of their damage to toilet rolls
const HORDE_FIRST_Z = -34;               // the horde is already on screen when the run starts
const HORDE_MAX = 450;                   // cap on live enemies so the horde stays playable
const enemyWalk = d => 0.35 + Math.min(1.7, d / 650);

const TIERS = [ // hp ceiling → color
  { max: 10, color: 0x16181c, name: 'black' },
  { max: 25, color: 0x2456d6, name: 'blue' },
  { max: 50, color: 0x1f9a47, name: 'green' },
  { max: 100, color: 0xe8c21a, name: 'yellow' },
  { max: 200, color: 0xf07a12, name: 'orange' },
  { max: 400, color: 0xd8262c, name: 'red' },
  { max: Infinity, color: 0x8a2be2, name: 'purple' },
];

const REWARDS = {
  MULTI:  { label: '+1 SHOT',   color: '#2f8cff', cap: s => s.multi < 6 },
  DIAG:   { label: 'DIAGONAL',  color: '#9b5cff', cap: s => s.diag < 4 },
  SIZE:   { label: 'BIG SHOT',  color: '#a0522d', cap: s => s.size < 6 },
  RATE:   { label: 'FIRE RATE', color: '#18b56a', cap: s => s.rate < 8 },
  DMG:    { label: '+5 DMG',    color: '#d6a400', cap: () => true },
  UNITS:  { label: '+5 CREW',   color: '#f5f7f9', cap: () => true },
  WEAPON: { label: 'WEAPON', color: '#56683a', cap: s => s.weapon < WEAPONS.length - 1 },
  BREAKER: { label: 'BOSS BREAKER', color: '#ffc83d', cap: () => false },  // only from armored-boss rolls
  SPIKE:  { label: 'SPIKE SHOT', color: '#e8343b', shape: 'spike', cap: s => s.spike < 4 },
  BOMB:   { label: 'BOMB SHOT',  color: '#ff7a00', shape: 'bomb',  cap: s => s.bomb < 4 },
  RING:   { label: 'RING SHOT',  color: '#19c3d8', shape: 'ring',  cap: s => s.ring < 4 },
  STAR:   { label: 'STAR SHOT',  color: '#ff4fb3', shape: 'star',  cap: s => s.star < 4 },
};
const SHAPE_KEYS = ['spike', 'bomb', 'ring', 'star'];
const WEAPONS = [
  { name: 'Pistol', rate: 1,   dmg: 1,   size: 0,     speed: 1,   splash: 0,   pierce: 0 },
  { name: 'Rifle',  rate: 1.8, dmg: 0.8, size: -0.03, speed: 1.2, splash: 0,   pierce: 0 },
  { name: 'Rocket', rate: 0.7, dmg: 2.2, size: 0.1,   speed: 0.8, splash: 1.4, pierce: 0 },
  { name: 'Laser',  rate: 1.6, dmg: 1.6, size: 0,     speed: 1.6, splash: 0,   pierce: 2 },
];
const REWARD_WEIGHT = { WEAPON: 3, MULTI: 3, DIAG: 3, SIZE: 2, RATE: 3, DMG: 2, UNITS: 2, SPIKE: 2, BOMB: 2, RING: 2, STAR: 2 };

// ---------- three setup ----------
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const SKY = 0xc9c9ee;
renderer.outputEncoding = THREE.sRGBEncoding;
const scene = new THREE.Scene();
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.Fog(SKY, 30, 60);
const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 300);
scene.add(new THREE.HemisphereLight(0xffffff, 0x4a5868, 0.72));
const sun = new THREE.DirectionalLight(0xfff6e8, 0.85);
sun.position.set(7, 22, 2);
sun.target.position.set(0, 0, -18);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 36, bottom: -36, near: 1, far: 70 });
sun.shadow.bias = -0.0008;
scene.add(sun); scene.add(sun.target);
const shade = o => { o.traverse(m => { if (m.isMesh) m.castShadow = true; }); return o; };

let camBaseY = 8.5, camBaseZ = 10.5;
function resize() {
  const w = window.innerWidth, h = window.innerHeight, aspect = w / h;
  renderer.setSize(w, h, false);
  camera.aspect = aspect;
  const hfov = 64 * Math.PI / 180;
  const vfov = 2 * Math.atan(Math.tan(hfov / 2) / aspect) * 180 / Math.PI;
  camera.fov = Math.max(52, Math.min(80, vfov));
  const narrow = Math.max(0, 1 - aspect);
  camBaseY = 8.5 + narrow * 7;
  camBaseZ = 10.5 + narrow * 5;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

// ---------- Blender-authored anime kit: shared vertex-colored meshes ----------
const modelGeometries = {};
for (const [name, data] of Object.entries(window.ANIME_MODELS)) {
  const base = new THREE.BufferGeometry();
  base.setAttribute('position', new THREE.Float32BufferAttribute(data.position, 3));
  base.setAttribute('normal', new THREE.Float32BufferAttribute(data.normal, 3));
  base.setAttribute('color', new THREE.Float32BufferAttribute(data.color, 3));
  base.setIndex(data.index);
  base.computeBoundingSphere();
  modelGeometries[name] = data.frames ? data.frames.map(positions => {
    const pose = new THREE.BufferGeometry();
    pose.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    pose.setAttribute('normal', base.attributes.normal);
    pose.setAttribute('color', base.attributes.color);
    pose.setIndex(base.index);
    pose.computeBoundingSphere();
    return pose;
  }) : base;
}
// Release the serialized arrays after uploading the reusable geometry.
delete window.ANIME_MODELS;
const POSES = modelGeometries.crew;
const poseFor = (ph, kind = 'crew') => modelGeometries[kind][Math.floor(((ph % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2) / (Math.PI * 2) * 8) % 8];
const animeMaterial = color => new THREE.MeshToonMaterial({ vertexColors: true, color });
const unitMat = animeMaterial(0xffffff);
const tierMats = TIERS.map((_, i) => animeMaterial(new THREE.Color().setHSL(.96 - i * .035, .09 + i * .025, .95 - i * .025)));
const propMat = animeMaterial(0xffffff);
const sealedPropMat = animeMaterial(0x667088);
const tierOf = hp => TIERS.findIndex(t => hp <= t.max);

// ---------- scenery ----------
const deckLen = 200;
const deck = new THREE.Mesh(new THREE.BoxGeometry(HALF_W * 2 + 1.2, 0.6, deckLen), new THREE.MeshLambertMaterial({ color: 0x7885a6 }));
deck.position.set(0, -0.3, -deckLen / 2 + 30);
deck.receiveShadow = true;
scene.add(deck);
const wallMat = new THREE.MeshLambertMaterial({ color: 0xe3e8fa });
for (const s of [-1, 1]) {
  const wall = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.3, deckLen), wallMat);
  wall.position.set(s * (HALF_W + 0.25), 0.65, -deckLen / 2 + 30);
  wall.receiveShadow = true; wall.castShadow = true;
  scene.add(wall);
  const cap = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.12, deckLen), new THREE.MeshLambertMaterial({ color: 0x55d9cd }));
  cap.position.set(s * (HALF_W + 0.25), 1.36, -deckLen / 2 + 30);
  scene.add(cap);
}
const water = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshLambertMaterial({ color: 0x78bfcf }));
water.rotation.x = -Math.PI / 2;
water.position.y = -7;
scene.add(water);

const lineMat = new THREE.MeshBasicMaterial({ color: 0xff2a2a });
const defenseLine = new THREE.Mesh(new THREE.BoxGeometry(HALF_W * 2, 0.04, 0.22), lineMat);
defenseLine.position.set(0, 0.02, LINE_Z);
scene.add(defenseLine);

const movers = []; // scrolling scenery that wraps
const dashGeo = new THREE.BoxGeometry(0.16, 0.02, 2.2), dashMat = new THREE.MeshBasicMaterial({ color: 0xf0f0f0 });
for (let i = 0; i < 24; i++) {
  const m = new THREE.Mesh(dashGeo, dashMat);
  m.position.set(0, 0.01, 20 - i * 7);
  scene.add(m); movers.push({ m, wrap: 24 * 7 });
}
for (let i = 0; i < 12; i++) {
  for (const s of [-1, 1]) {
    const g = new THREE.Group();
    const lantern = new THREE.Mesh(modelGeometries.pylon, propMat);
    lantern.castShadow = true; g.add(lantern);
    g.position.set(s * (HALF_W + 0.25), 0, 20 - i * 14);
    scene.add(g); movers.push({ m: g, wrap: 12 * 14 });
  }
}

const laneDecor = new THREE.Group();
for (const s of [-1, 1]) {
  const len = 170;
  const wall = new THREE.Mesh(new THREE.BoxGeometry(LANE_WALL_T * 2, 1.3, len), wallMat);
  wall.position.set(s * LANE_EDGE, 0.65, LANE_WALL_END - len / 2);
  wall.castShadow = wall.receiveShadow = true;
  laneDecor.add(wall);
  const cap = new THREE.Mesh(new THREE.BoxGeometry(LANE_WALL_T * 2 + 0.12, 0.12, len), new THREE.MeshLambertMaterial({ color: 0x55d9cd }));
  cap.position.set(s * LANE_EDGE, 1.36, LANE_WALL_END - len / 2);
  laneDecor.add(cap);
}
const conveyor = new THREE.Mesh(new THREE.PlaneGeometry(HALF_W * 2 / 3 - LANE_WALL_T * 2, deckLen), new THREE.MeshLambertMaterial({ color: 0x8ba5cf }));
conveyor.rotation.x = -Math.PI / 2;
conveyor.position.set(LANE_X, 0.008, -deckLen / 2 + 30);
conveyor.receiveShadow = true;
laneDecor.add(conveyor);
laneDecor.visible = false;
scene.add(laneDecor);

// ---------- canvas labels ----------
function canvasTex(w, h) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = 4;
  return { c, ctx: c.getContext('2d'), tex };
}
function fitFont(ctx, text, maxW, size, family) {
  let s = size;
  do { ctx.font = `${s}px ${family}`; s -= 4; } while (ctx.measureText(text).width > maxW && s > 16);
}
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
const FONT = "Bungee, 'Arial Black', Impact, sans-serif";

// ---------- bullets (instanced) ----------
function starGeo() {
  const sh = new THREE.Shape();
  for (let i = 0; i < 10; i++) {
    const r = i % 2 ? 0.5 : 1.25, a = i / 10 * Math.PI * 2 + Math.PI / 2;
    if (i) sh.lineTo(Math.cos(a) * r, Math.sin(a) * r); else sh.moveTo(Math.cos(a) * r, Math.sin(a) * r);
  }
  const g = new THREE.ExtrudeGeometry(sh, { depth: 0.5, bevelEnabled: false });
  g.translate(0, 0, -0.25);
  return g;
}
const SHAPES = {
  orb:   { geo: new THREE.IcosahedronGeometry(1, 1), color: 0xffb400 },
  spike: { geo: new THREE.ConeGeometry(0.8, 2.6, 4), color: 0xe8343b },
  bomb:  { geo: new THREE.BoxGeometry(1.5, 1.5, 1.5), color: 0xff7a00 },
  ring:  { geo: new THREE.TorusGeometry(0.95, 0.34, 6, 16), color: 0x19c3d8 },
  star:  { geo: starGeo(), color: 0xff4fb3 },
};
for (const k in SHAPES) {
  const c = new THREE.Color(SHAPES[k].color);
  const mesh = new THREE.InstancedMesh(SHAPES[k].geo, new THREE.MeshLambertMaterial({ color: c, emissive: c.clone().multiplyScalar(0.55) }), MAX_BULLETS);
  mesh.frustumCulled = false;
  mesh.count = 0;
  scene.add(mesh);
  SHAPES[k].mesh = mesh;
}
const dummy = new THREE.Object3D();

// bomb splash flashes
const booms = Array.from({ length: 16 }, () => {
  const m = new THREE.Mesh(new THREE.SphereGeometry(1, 14, 10), new THREE.MeshBasicMaterial({ color: 0xff9a3c, transparent: true, opacity: 0, depthWrite: false }));
  m.visible = false; scene.add(m);
  return { m, t: 1, R: 1 };
});
let boomIdx = 0;
function boom(x, z, R) {
  const b = booms[boomIdx++ % booms.length];
  b.t = 0; b.R = R; b.m.visible = true; b.m.position.set(x, BULLET_Y, z);
}

// ---------- health bars ----------
const barBgMat = new THREE.SpriteMaterial({ color: 0x1a1d22, depthTest: false });
const barFgMat = new THREE.SpriteMaterial({ color: 0xff4040, depthTest: false });

// ---------- state ----------
let G, units, enemies, bullets, barrels, gates, pickups, dying, pads, hazards;
let running = false;
const stats = {};
const input = { left: false, right: false, dragging: false, startX: 0, startTarget: 0 };

const crowdLabel = canvasTex(160, 72);
const crowdSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: crowdLabel.tex, depthTest: false }));
crowdSprite.scale.set(1.5, 0.68, 1);
crowdSprite.renderOrder = 10;
scene.add(crowdSprite);
function drawCrowdLabel(n) {
  const { ctx, c, tex } = crowdLabel;
  ctx.clearRect(0, 0, c.width, c.height);
  ctx.fillStyle = 'rgba(47,140,255,0.92)'; roundRect(ctx, 8, 6, c.width - 16, c.height - 12, 26); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  fitFont(ctx, String(n), c.width - 40, 46, FONT); ctx.fillText(String(n), c.width / 2, c.height / 2 + 2);
  tex.needsUpdate = true;
}

function resetGame(mode = 'classic') {
  for (const list of [units, enemies, barrels, gates, pickups, dying, pads, hazards]) if (list) for (const o of list) removeObj(o);
  G = { mode, dist: 0, time: 0, kills: 0, peak: 1, crowdX: 0, target: 0, crowdZ: 0, nextAt: 4, script: 0, cycle: 0, rowId: 0, over: false,
        upgradeRows: 0, bossDue: false, bosses: 0, rolls: 0, rollsBroken: 0, rollCooldown: 10,  // first roll shows up once the crew has had time to grow
        nextPad: 0, slots: [], compactT: 0 };
  laneDecor.visible = mode === 'lanes';
  Object.assign(stats, { multi: 1, size: 0, diag: 0, rate: 0, dmg: BASE_DMG, spike: 0, bomb: 0, ring: 0, star: 0, weapon: 0 });
  units = []; enemies = []; bullets = []; barrels = []; gates = []; pickups = []; dying = []; pads = []; hazards = [];
  addUnits(1);
  drawCrowdLabel(1);
}
function removeObj(o) {
  if (o.mesh) scene.remove(o.mesh);
  if (o.group) scene.remove(o.group);
  if (o.bar) { scene.remove(o.bar.bg); scene.remove(o.bar.fg); }
  if (o.label) scene.remove(o.label);
}

// ---------- derived stats ----------
// three-lanes mode crawls forward, so its difficulty follows elapsed time instead of distance
const prog = () => (G.mode === 'lanes' ? G.time * 2.6 : G.dist);
const scrollNow = () => (G.mode === 'lanes' ? 1 + 0.5 * (1 - Math.exp(-G.time / 300)) : scrollSpeed(G.dist));

// ---------- units ----------
function addUnits(n) {
  const room = MAX_UNITS - units.length;
  const add = Math.min(n, room);
  for (let i = 0; i < add; i++) {
    const mesh = new THREE.Mesh(POSES[0], unitMat);
    mesh.castShadow = true;
    const a = Math.random() * Math.PI * 2;
    const u = { mesh, x: G.crowdX + Math.cos(a) * 0.3, z: G.crowdZ - 0.5 + Math.sin(a) * 0.3, phase: Math.random() * 6, cd: Math.random() * fireInterval(), shot: 0 };
    mesh.position.set(u.x, 0, u.z);
    scene.add(mesh);
    let slot = G.slots.indexOf(null);
    if (slot < 0) slot = G.slots.length;
    G.slots[slot] = u; u.slot = slot;
    units.push(u);
  }
  G.peak = Math.max(G.peak, units.length);
  if (add < n && n > 0) toast('Crew is full', '#f5f7f9');
  return add;
}
function killUnit(u) {
  const i = units.indexOf(u);
  if (i < 0) return;
  units.splice(i, 1);
  G.slots[u.slot] = null;  // survivors hold their spots; the crowd closes gaps gradually in update()
  while (G.slots.length && !G.slots[G.slots.length - 1]) G.slots.pop();
  dieAnim(u.mesh, Math.random() < 0.5 ? -1 : 1);
}
function removeUnits(n) {
  for (let i = 0; i < n && units.length; i++) killUnit(units[units.length - 1]);
}
function dieAnim(mesh, dir) {

}

const immune = e => e.armored && !G.breaker;
// close bosses telegraph a red strip where the crew stands, then slam it; strafe out to survive

const SLAM_WINDUP = 1.8;
function bossSlam(e, dt) {
  if (e.z < -18 || !units.length) return;
  e.slamCd = (e.slamCd ?? 1.5) - dt;
  if (!e.slam && e.slamCd <= 0) {
    const x0 = Math.max(-HALF_W, G.crowdX - 1.3), x1 = Math.min(HALF_W, G.crowdX + 1.3), z0 = e.z + e.r;

    m.rotation.x = -Math.PI / 2;

}
// enemies never shelter behind something that blocks shots: they wait a clear gap back until it is gone
const COVER_GAP = 8;

    if (b.z <= e.z || b.z > G.crowdZ) continue;
    if (Math.abs(e.x - b.x) < (b.roll ? b.R : BARREL_R) + e.r) limit = Math.min(limit, b.z - COVER_GAP);
  }
  for (const g of gates) {
    if (g.done || g.z <= e.z || g.z > G.crowdZ) continue;
    if (e.x > g.x0 - e.r && e.x < g.x1 + e.r) limit = Math.min(limit, g.z - COVER_GAP);

}
function killEnemy(e) {
  if (e.slam) { scene.remove(e.slam.m); e.slam = null; }

  const i = enemies.indexOf(e);
  if (i < 0) return;
  enemies.splice(i, 1);
  if (e.bar) { scene.remove(e.bar.bg); scene.remove(e.bar.fg); }
  G.kills++;
  dieAnim(e.mesh, Math.random() < 0.5 ? -1 : 1);
}

// ---------- gates ----------
const FACTORS = [1 / 4, 1 / 3, 1 / 2, 1, 2, 3, 4, 5];  // ×/÷ gate steps; 100 bullets move one step up
const FX = { half: 2, one: 3, x2: 4, x3: 5 };

function spawnGate(side, z, value, rowId, op = '+') {
  const group = new THREE.Group();
  const w = HALF_W - 0.15;
  const lbl = canvasTex(320, 160);
  const panel = new THREE.Mesh(new THREE.PlaneGeometry(w, w / 2), new THREE.MeshBasicMaterial({ map: lbl.tex, transparent: true, depthWrite: false, side: THREE.DoubleSide }));
  panel.position.y = 1.55; group.add(panel);

    const post = new THREE.Mesh(new THREE.BoxGeometry(0.18, 2.9, 0.18), postM);
    post.position.set(s * w / 2, 1.45, 0); post.castShadow = true; group.add(post);
  }
  const top = new THREE.Mesh(new THREE.BoxGeometry(w + 0.18, 0.16, 0.18), postM);
  top.position.y = 2.9; group.add(top);
  const cx = side * HALF_W / 2;
  group.position.set(cx, 0, z);
  scene.add(group);
  const g = { group, panel, side, x0: side < 0 ? -HALF_W : 0, x1: side < 0 ? 0 : HALF_W, z, pz: z, op, value, rowId, lbl, done: false, fade: 0, dirty: true, pulse: 0, prog: 0 };

}
function drawGate(g) {
  const { ctx, c, tex } = g.lbl;
  ctx.clearRect(0, 0, c.width, c.height);
  const f = g.op === 'x' ? FACTORS[g.value] : 0;
  const good = g.op === 'x' ? f > 1 : g.value > 0, bad = g.op === 'x' ? f < 1 : g.value < 0;
  ctx.fillStyle = good ? (g.op === 'x' ? 'rgba(124,77,255,0.75)' : 'rgba(47,140,255,0.72)') : bad ? 'rgba(232,52,59,0.72)' : 'rgba(150,160,170,0.6)';
  ctx.fillRect(0, 0, c.width, c.height);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const t = g.op === 'x' ? factorLabel(f) : (g.value > 0 ? '+' : '') + g.value;
  fitFont(ctx, t, c.width - 40, 96, FONT);
  ctx.lineWidth = 8; ctx.strokeStyle = 'rgba(18,22,29,0.8)'; ctx.strokeText(t, c.width / 2, c.height / 2 - 6);
  ctx.fillStyle = '#fff'; ctx.fillText(t, c.width / 2, c.height / 2 - 6);
  ctx.fillStyle = 'rgba(18,22,29,0.55)'; roundRect(ctx, 24, c.height - 30, c.width - 48, 14, 7); ctx.fill();
  if (g.prog > 0) { ctx.fillStyle = '#ffffff'; roundRect(ctx, 24, c.height - 30, Math.max(14, (c.width - 48) * g.prog / gateCost(g)), 14, 7); ctx.fill(); }
  tex.needsUpdate = true;
  g.dirty = false;
}
const gateCost = g => (g.op === 'x' ? GATE_BULLETS * 2 : GATE_BULLETS);
function applyGate(g) {
  for (const o of gates) if (o.rowId === g.rowId) o.done = true;
  g.pulse = 1;
  if (g.op === 'x') {
    const f = FACTORS[g.value], n0 = units.length, diff = Math.round(n0 * f) - n0;
    if (diff > 0) addUnits(diff); else if (diff < 0) removeUnits(Math.min(n0, -diff));
    toast(`${factorLabel(f)} → ${diff >= 0 ? '+' : '−'}${Math.abs(diff)} crew`, diff >= 0 ? '#7c4dff' : '#e8343b');
  } else if (g.value > 0) {
    const n = addUnits(g.value);
    if (n) toast(`+${n} crew`, '#2f8cff');
  } else if (g.value < 0) {
    const n = Math.min(units.length, -g.value);

    toast(`−${n} crew`, '#e8343b');
  }
}

}

  switch (kind) {
    case 'MULTI': stats.multi++; break;
    case 'DIAG': stats.diag++; break;
    case 'SIZE': stats.size++; break;
    case 'RATE': stats.rate++; break;
    case 'DMG': stats.dmg += 5; break;

  toast(label, REWARDS[kind].color);

// ---------- three-lanes energy cells (left) and +1 pads (right) ----------
const ROLL_R = 1.46, ROLL_CORE = 0.5, ROLL_H = 5.4;

  tail.rotation.x = -Math.PI / 2; tail.position.y = 0.02; tail.scale.y = 0.001; group.add(tail);
  const lbl = canvasTex(320, 180);
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: lbl.tex, depthTest: false }));
  sprite.scale.set(3.2, 1.8, 1); sprite.position.y = ROLL_H + 1.7; sprite.renderOrder = 8;

// Cells discharge as they lose health: shrinking shell, faster spin, longer energy trail.
function updateRoll(b, dt) {
  const left = Math.max(0, b.hits) / b.maxHits;
  const target = ROLL_CORE + 0.08 + (ROLL_R - ROLL_CORE - 0.08) * Math.sqrt(left);
  b.R += (target - b.R) * Math.min(1, dt * 6);
  b.paper.scale.set(b.R / ROLL_R, 1, b.R / ROLL_R);
  b.spin = Math.max(0.4, b.spin - dt * 4);
  b.paper.rotation.y += b.spin * dt;
  const len = (1 - left) * 7;
  b.tail.scale.y = Math.max(0.001, len);
  b.tail.position.z = b.R + len / 2;
  b.gem.rotation.y += dt * 2;
}

function spawnHordePack(n, frontZ, base) {

    const x = -1.25 + (i % 6) * 0.5 + (Math.random() - 0.5) * 0.18;
    const z = frontZ - Math.floor(i / 6) * 0.5 - Math.random() * 0.2;

}
function lanesDirector(dt) {

    G.filled = true;

    spawnHordePack(15, HORDE_FIRST_Z, 1);
    spawnHordePack(15, HORDE_FIRST_Z - 12, 1);
  }
  const p = prog();
  if (G.dist >= G.nextAt) {  // horde pack down the middle
    const n = Math.min(200, 15 * (2 + Math.floor(p / 120) + rint(0, 1)), HORDE_MAX - enemies.length);
    spawnHordePack(n, SPAWN_Z, enemyHp(p));
    G.nextAt += Math.max(8, 18 - p / 40);  // dense packs, spaced out so the crew can clear each one
  }
  while (G.dist >= G.nextPad) { spawnPad(LANE_X, SPAWN_Z); G.nextPad += 3; }
  if (!barrels.some(b => b.roll)) {  // one toilet roll at a time down the left
    const armoredAlive = enemies.some(e => e.armored);

// ---------- update ----------
function update(dt) {

    else if (p.z > 12) { scene.remove(p.group); pickups.splice(i, 1); }
  }

  // bullets
  for (let i = 0; i < bullets.length; i++) {
    const b = bullets[i];
    const ox = b.x, oz = b.z;
    b.x += b.vx * dt; b.z += b.vz * dt; b.life -= dt;
    if (b.x - b.r < -HALF_W) { b.x = 2 * (-HALF_W + b.r) - b.x; b.vx = -b.vx; }
    else if (b.x + b.r > HALF_W) { b.x = 2 * (HALF_W - b.r) - b.x; b.vx = -b.vx; }
    if (G.mode === 'lanes' && b.z < LANE_WALL_END) {
      if (b.lane === undefined) b.lane = b.x < -LANE_EDGE ? -1 : b.x > LANE_EDGE ? 1 : 0;
      const lo = b.lane < 0 ? -HALF_W : b.lane === 0 ? -LANE_EDGE + LANE_WALL_T : LANE_EDGE + LANE_WALL_T;
      const hi = b.lane > 0 ? HALF_W : b.lane === 0 ? LANE_EDGE - LANE_WALL_T : -LANE_EDGE - LANE_WALL_T;
      if (b.x - b.r < lo) { b.x = Math.min(hi - b.r, 2 * (lo + b.r) - b.x); b.vx = Math.abs(b.vx); }
      else if (b.x + b.r > hi) { b.x = Math.max(lo + b.r, 2 * (hi - b.r) - b.x); b.vx = -Math.abs(b.vx); }
    } else b.lane = undefined;
    let dead = b.life <= 0 || b.z < SPAWN_Z - 5;
    if (!dead) for (const br of barrels) {
      if (Math.abs(br.z - b.z) > BARREL_R + 2) continue;
      const rr = (br.roll ? br.R : BARREL_R) + b.r;
      if (segDist2(ox, oz, b.x, b.z, br.x, br.z) < rr * rr) {
        br.hits -= br.roll ? stats.dmg * b.dmgMul * weapon().dmg * ROLL_DMG_SCALE : 1;
        br.dirty = true; br.shake = 0.1; dead = true;
        if (br.roll) { br.spin = 7; if (Math.random() < 0.15 && bits.length < 30) flake(br.x, br.z + br.R); }
        if (br.hits <= 0) breakBarrel(br);
        break;
      }
    }
    if (!dead) for (const h of hazards) {  // tyres soak up shots
      if (Math.abs(h.z - b.z) < 1.4 && Math.abs(h.x - b.x) < 0.55 + b.r) { dead = true; break; }
    }
    if (!dead) for (const g of gates) {
      if (g.done) continue;
      if (oz - g.pz > 0 && b.z - g.z <= 0 && b.x >= g.x0 && b.x <= g.x1) {
        if (++g.prog >= gateCost(g)) { g.prog = 0; g.value = g.op === 'x' ? Math.min(FACTORS.length - 1, g.value + 1) : g.value + 1; g.pulse = 0.5; }
        g.dirty = true; dead = true; break;
      }
    }
    if (!dead) {
      for (const e of enemies) {
        if (e.hp <= 0 || Math.abs(e.z - b.z) > 2.5) continue;
        if (b.hit && b.hit.includes(e)) continue;
        const rr = e.r + b.r;
        if (segDist2(ox, oz, b.x, b.z, e.x, e.z) < rr * rr && hitEnemy(b, e)) { dead = true; break; }
      }
      flushKills();
    }
    if (dead) { bullets[i] = bullets[bullets.length - 1]; bullets.pop(); i--; }
  }

  if (G.won) return gameOver('win');
  if (!units.length) return gameOver('crew');
}

function animate(dt) {
  // dying figures fall over
  for (let i = dying.length - 1; i >= 0; i--) {
    const d = dying[i];
    d.t += dt;
    const k = Math.min(1, d.t / 0.3);
    d.mesh.rotation.z = d.dir * k * Math.PI / 2;
    d.mesh.position.y = -Math.max(0, d.t - 0.5) * 2;
    if (running) d.mesh.position.z += scrollNow() * dt;
    if (d.t > 0.9) { scene.remove(d.mesh); dying.splice(i, 1); }
  }
  for (let i = bits.length - 1; i >= 0; i--) {
    const p = bits[i];
    p.t += dt; p.vy -= (p.float ? 4 : 18) * dt;
    if (p.float && running) p.m.position.z += scrollNow() * dt;
    p.m.position.x += p.vx * dt; p.m.position.y += p.vy * dt; p.m.position.z += p.vz * dt;
    p.m.rotation.x += dt * 5;
    if (p.t > 1.2) { scene.remove(p.m); bits.splice(i, 1); }
  }
  if (running) {
    const scroll = scrollNow();
    for (const mv of movers) { mv.m.position.z += scroll * dt; if (mv.m.position.z > 22) mv.m.position.z -= mv.wrap; }
  }
  // bullets → instances, one instanced mesh per shape
  const t = performance.now() / 1000;
  const counts = { orb: 0, spike: 0, bomb: 0, ring: 0, star: 0 };
  for (const b of bullets) {
    const i = counts[b.shape]++;
    dummy.position.set(b.x, BULLET_Y, b.z);
    dummy.scale.setScalar(b.r);
    const spin = t * 7 + b.seed;
    if (b.shape === 'spike') dummy.rotation.set(-Math.PI / 2, Math.atan2(-b.vx, -b.vz), 0, 'YXZ');
    else if (b.shape === 'bomb') dummy.rotation.set(spin, spin * 0.7, 0, 'XYZ');
    else if (b.shape === 'ring') dummy.rotation.set(0, spin, 0, 'XYZ');
    else if (b.shape === 'star') dummy.rotation.set(0, 0, spin, 'XYZ');
    else dummy.rotation.set(0, 0, 0, 'XYZ');
    dummy.updateMatrix();
    SHAPES[b.shape].mesh.setMatrixAt(i, dummy.matrix);
  }
  for (const k in SHAPES) { SHAPES[k].mesh.count = counts[k]; SHAPES[k].mesh.instanceMatrix.needsUpdate = true; }
  for (const b of booms) {
    if (b.t >= 0.3) { b.m.visible = false; continue; }
    b.t += dt;
    b.m.scale.setScalar(b.R * Math.min(1, b.t / 0.12));
    b.m.material.opacity = 0.55 * Math.max(0, 1 - b.t / 0.3);
  }

  // line pulses when enemies get close
  let near = 0;
  for (const e of enemies) near = Math.max(near, 1 - Math.min(1, (LINE_Z - e.z) / 12));
  lineMat.color.setRGB(1, 0.16 + 0.5 * near * (0.5 + 0.5 * Math.sin(performance.now() / 80)), 0.16);

  // crowd label + camera
  if (units && units.length) {
    crowdSprite.visible = true;
    crowdSprite.position.set(G.crowdX, 2.3, G.crowdZ - 0.2);
    if (crowdSprite.userData.n !== units.length) { crowdSprite.userData.n = units.length; drawCrowdLabel(units.length); }
  } else crowdSprite.visible = false;
  const cx = G ? G.crowdX * 0.35 : 0;
  camera.position.x += (cx - camera.position.x) * Math.min(1, dt * 4);
  camera.position.y = camBaseY; camera.position.z = camBaseZ;
  camera.lookAt(camera.position.x * 0.5, 0, -11);
}

// ---------- HUD ----------
const $ = id => document.getElementById(id);
const toastsEl = $('toasts');
function toast(text, color) {
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = text; el.style.color = color;
  toastsEl.appendChild(el);
  setTimeout(() => el.remove(), 2000);
  while (toastsEl.children.length > 3) toastsEl.firstChild.remove();
}
let lastHud = '';
function hud() {
  const s = `${units.length}|${Math.floor(G.dist)}|${G.kills}|${stats.weapon}`;
  if (s === lastHud) return;
  lastHud = s;
  $('hudUnits').textContent = units.length;
  $('hudDist').textContent = `${Math.floor(G.dist)} m`;
  $('hudKills').textContent = `${G.kills} down`;
  $('hudWeapon').textContent = `Crew · ${weapon().name}`;
}

function gameOver(why) {
  running = false;
  G.over = true;
  $('endTitle').textContent = { line: 'Line broken', crew: 'Crew lost', win: 'Bridge held' }[why];
  $('endReason').textContent = { line: 'An enemy made it past the red line.', crew: 'Your last crew member went down.', win: 'All three bosses are down.' }[why];
  $('endDist').textContent = Math.floor(G.dist);
  $('endKills').textContent = G.kills;
  $('endPeak').textContent = G.peak;
  const shapes = SHAPE_KEYS.filter(k => stats[k] > 0).map(k => `${k} ${stats[k]}`);
  $('endBuild').textContent = `Build: ${weapon().name} · ${stats.multi} shot · ${stats.diag} diagonal · size ${stats.size} · rate ${stats.rate} · ${stats.dmg} dmg` + (shapes.length ? ` · ${shapes.join(' · ')}` : '');
  $('hud').hidden = true;
  $('endModal').hidden = false;
  $('againBtn').focus();
}
let lastMode = 'classic';
function start(mode = lastMode) {
  lastMode = mode;
  resetGame(mode);
  $('startModal').hidden = true; $('endModal').hidden = true;
  $('hud').hidden = false;
  lastHud = '';
  running = true;
}
$('startClassic').addEventListener('click', () => start('classic'));
$('startLanes').addEventListener('click', () => start('lanes'));
$('againBtn').addEventListener('click', () => start());
$('menuBtn').addEventListener('click', () => { $('endModal').hidden = true; $('startModal').hidden = false; $('startClassic').focus(); });

// ---------- input ----------
const canvas = renderer.domElement;
canvas.addEventListener('pointerdown', e => {
  input.dragging = true; input.startX = e.clientX; input.startTarget = G ? G.target : 0;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  if (!input.dragging || !G) return;
  const perPx = (HALF_W * 2 * 1.25) / Math.min(window.innerWidth, 900);
  G.target = Math.max(-HALF_W, Math.min(HALF_W, input.startTarget + (e.clientX - input.startX) * perPx));
});
const endDrag = () => { input.dragging = false; };
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') input.left = true;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') input.right = true;
});
window.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') input.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') input.right = false;
});
window.addEventListener('blur', () => { input.left = input.right = false; });

// ---------- loop ----------
resetGame();
let last = performance.now();
const TIME_SCALE = Number(new URLSearchParams(location.search).get('speed')) || 1;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (running) { for (let s = 0; s < GAME_SPEED * TIME_SCALE && running; s++) update(dt); if (running) hud(); }
  animate(dt * GAME_SPEED);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__game = { step(n, dt = 1 / 60) { for (let i = 0; i < n && running; i++) update(dt); }, addUnits: n => addUnits(n), spawnBoss, spawnTyre, get hazards() { return hazards; }, get G() { return G; }, stats, get units() { return units; }, get enemies() { return enemies; }, get bullets() { return bullets; }, get gates() { return gates; }, get barrels() { return barrels; }, get pickups() { return pickups; } };
})();
</script>
